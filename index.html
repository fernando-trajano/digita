<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>digita. — treino de digitação em português</title>
  <meta name="description" content="Treino de digitação em português do Brasil, com foco em acentos, Ç e nas diferenças entre o teclado ABNT2 e o americano.">

  <!-- Escolhe o tema ANTES de a página aparecer, para não piscar branco em
       quem usa o modo escuro. É o único JavaScript fora da pasta js/, e ele
       precisa estar aqui: qualquer coisa carregada depois já seria tarde.
       A regra é a mesma do app.js (ver a seção Tema lá): a escolha manual
       só vale enquanto o sistema continuar no tema que tinha quando ela foi
       feita. Ela está repetida aqui porque isto roda antes de tudo. -->
  <script>
    (function () {
      var salvo = {};
      try {
        salvo = JSON.parse(localStorage.getItem('digita:config') || '{}');
      } catch (erro) {
        /* navegador sem localStorage: segue o sistema */
      }
      var sistema =
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';

      document.documentElement.dataset.tema =
        salvo.tema && salvo.temaDoSistemaNaEscolha === sistema ? salvo.tema : sistema;
    })();
  </script>

  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="./css/tema.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/componentes.css">
  <link rel="stylesheet" href="./css/teclado.css">
  <link rel="stylesheet" href="./css/telas.css">
</head>
<body>

  <!-- Ícones do site. Ficam aqui dentro, desenhados uma vez, e são reusados
       com <use href="#icone-x">. Sem arquivo externo: nada a baixar, e
       funciona igual em qualquer navegador. -->
  <svg class="sprite-icones" aria-hidden="true" focusable="false">
    <symbol id="icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </symbol>
    <symbol id="icone-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
    </symbol>
    <symbol id="icone-som" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path>
      <path d="M16 9.2a4 4 0 0 1 0 5.6"></path>
      <path d="M18.6 6.6a7.5 7.5 0 0 1 0 10.8"></path>
    </symbol>
    <symbol id="icone-mudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path>
      <path d="M16.5 9.5l5 5M21.5 9.5l-5 5"></path>
    </symbol>
    <!-- As quatro ilustrações do Treino livre. Monocromáticas, em
         currentColor: é isso que as faz acompanhar o tema sozinhas. As
         quatro dividem o mesmo viewBox de propósito — é o que impede a
         coluna de pular de altura quando o desenho troca. -->
    <symbol id="ilustracao-adaptativo" viewBox="0 0 320 240" style="font-family: var(--fonte-mono)">
      <!-- Linhas de "mira": ligam apenas os caracteres grandes, os que o modo
      sorteia mais. Param antes de tocar no glifo, para não cortar a letra. -->
      <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.22">
      <path d="M131 117 L178 101"/>
      <path d="M219 114 L234 139"/>
      <path d="M122 152 L135 166"/>
      <path d="M171 177 L224 163"/>
      </g>

      <!-- Caracteres soltos, sem alinhamento. O tamanho e o tom marcam a
      dificuldade: grande e forte = tecla que escapa; pequeno e claro =
      tecla já dominada. -->
      <g fill="currentColor" stroke="none" text-anchor="middle" dominant-baseline="central">
      <text x="100" y="128" font-size="48" opacity="0.95">ç</text>
      <text x="205" y="92"  font-size="40" opacity="0.85">q</text>
      <text x="150" y="182" font-size="30" opacity="0.70">z</text>
      <text x="245" y="158" font-size="27" opacity="0.60">p</text>

      <text x="58"  y="72"  font-size="17" opacity="0.34">w</text>
      <text x="118" y="58"  font-size="14" opacity="0.30">x</text>
      <text x="272" y="55"  font-size="15" opacity="0.30">k</text>
      <text x="62"  y="192" font-size="16" opacity="0.30">b</text>
      <text x="180" y="214" font-size="14" opacity="0.27">a</text>
      <text x="288" y="206" font-size="13" opacity="0.24">m</text>
      <text x="30"  y="140" font-size="12" opacity="0.22">s</text>
      <text x="300" y="120" font-size="12" opacity="0.20">f</text>
      </g>
    </symbol>

    <symbol id="ilustracao-acentos" viewBox="0 0 320 240">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

      <!-- A cedilha grande: o elemento âncora, embaixo e ao centro. -->
      <path d="M170 142 C170 166, 193 169, 193 190 C193 209, 170 214, 153 203"
      stroke-width="2.4" opacity="0.9"/>

      <!-- Til grande, atravessando a parte de cima. Só curva, nada reto. -->
      <path d="M48 106 C61 84, 78 84, 90 99 C102 114, 119 114, 132 91"
      stroke-width="2.2" opacity="0.85"/>

      <!-- Circunflexo, levemente girado para não ficar de pé. -->
      <path d="M158 72 L184 43 L210 72" stroke-width="2.2" opacity="0.8"
      transform="rotate(-7 184 58)"/>

      <!-- Agudo e grave, as diagonais. -->
      <path d="M240 56 L264 29" stroke-width="2.2" opacity="0.75"/>
      <path d="M34 44 L56 65"   stroke-width="2" opacity="0.6"/>

      <!-- Os pequenos, nas margens, em escalas menores. -->
      <path d="M66 176 L79 162 L92 176" stroke-width="1.5" opacity="0.4"
      transform="rotate(6 79 169)"/>
      <path d="M244 176 C250 168, 257 168, 263 174 C269 180, 276 180, 282 171"
      stroke-width="1.5" opacity="0.42"/>
      <path d="M268 132 L281 117" stroke-width="1.5" opacity="0.35"/>
      <path d="M226 210 L238 221" stroke-width="1.5" opacity="0.3"/>
      <path d="M100 214 C104 209, 109 209, 113 213"
      stroke-width="1.4" opacity="0.28"/>
      <path d="M30 152 C30 162, 40 163, 40 172 C40 180, 30 182, 23 177"
      stroke-width="1.5" opacity="0.32"/>
      </g>
    </symbol>

    <symbol id="ilustracao-numerico" viewBox="0 0 320 240" style="font-family: var(--fonte-mono)">
      <!-- Cascata: dígitos e operadores despencando numa faixa vertical, em
      tamanhos decrescentes. Os operadores ficam mais claros que os
      números, para os dígitos liderarem a leitura. -->
      <g fill="currentColor" stroke="none" text-anchor="middle" dominant-baseline="central">
      <text x="122" y="34"  font-size="42" opacity="0.9">7</text>
      <text x="178" y="54"  font-size="30" opacity="0.45">+</text>
      <text x="142" y="80"  font-size="38" opacity="0.85">4</text>
      <text x="197" y="98"  font-size="32" opacity="0.7">8</text>
      <text x="108" y="112" font-size="26" opacity="0.4">−</text>
      <text x="162" y="134" font-size="30" opacity="0.68">5</text>
      <text x="120" y="152" font-size="26" opacity="0.58">2</text>
      <text x="202" y="160" font-size="22" opacity="0.36">×</text>
      <text x="156" y="180" font-size="22" opacity="0.48">9</text>
      <text x="114" y="194" font-size="18" opacity="0.4">3</text>
      <text x="186" y="202" font-size="18" opacity="0.3">÷</text>
      <text x="146" y="216" font-size="16" opacity="0.28">0</text>
      <text x="206" y="224" font-size="14" opacity="0.22">1</text>
      <text x="98"  y="228" font-size="13" opacity="0.2">6</text>
      </g>
    </symbol>

    <symbol id="ilustracao-texto" viewBox="0 0 320 240">
      <g fill="none" stroke="currentColor" stroke-linecap="round">

      <!-- O bloco de texto: linhas de comprimentos irregulares, alinhadas à
      esquerda, com a borda direita rasgada. -->
      <path d="M46 58 L252 58"  stroke-width="2.4" opacity="0.72"/>
      <path d="M46 80 L274 80"  stroke-width="2.4" opacity="0.68"/>
      <path d="M46 102 L214 102" stroke-width="2.4" opacity="0.64"/>

      <!-- Duas linhas deslocadas e mais claras: o texto sendo colado ali. -->
      <path d="M64 124 L246 124" stroke-width="2.2" opacity="0.38"/>

      <path d="M46 146 L266 146" stroke-width="2.4" opacity="0.6"/>
      <path d="M46 168 L196 168" stroke-width="2.4" opacity="0.56"/>

      <path d="M76 190 L258 190" stroke-width="2.2" opacity="0.3"/>

      <!-- A última linha, curta, e o cursor no fim dela. -->
      <path d="M46 212 L118 212" stroke-width="2.4" opacity="0.52"/>
      <path d="M132 199 L132 225" stroke-width="2.8" opacity="0.9"/>
      </g>
    </symbol>

    <symbol id="icone-cadeado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect>
      <path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"></path>
    </symbol>

    <symbol id="icone-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9l6 6 6-6"></path>
    </symbol>

    <symbol id="icone-estrela" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"></path>
    </symbol>
  </svg>

  <header class="cabecalho">
    <a class="marca" href="./">digita<span class="marca-ponto">.</span></a>

    <nav class="cabecalho-acoes">
      <div class="seletor" role="group" data-i18n-aria="cabecalho.idioma" aria-label="Idioma da interface">
        <button type="button" class="seletor-opcao" data-idioma="pt" aria-pressed="true">PT</button>
        <button type="button" class="seletor-opcao" data-idioma="en" aria-pressed="false">EN</button>
      </div>

      <button type="button" class="botao-icone" id="botao-som" data-i18n-aria="som.silenciar" aria-label="Silenciar os sons" aria-pressed="false">
        <svg aria-hidden="true"><use href="#icone-som"></use></svg>
      </button>

      <button type="button" class="botao-icone" id="botao-tema" data-i18n-aria="cabecalho.alternarTema" aria-label="Alternar entre modo claro e escuro">
        <svg aria-hidden="true"><use href="#icone-lua"></use></svg>
      </button>
    </nav>
  </header>

  <!-- Todas as telas do site aparecem dentro deste <main>, trocadas pelo
       JavaScript. O conteúdo escrito aqui é só o que se vê enquanto o
       JavaScript não carregou. -->
  <main class="conteudo" id="tela">

    <!-- Reserva, para quem chega antes do JavaScript carregar. -->
    <p class="ajuda" data-i18n="entrada.subtitulo">
      O digita. mostra qual dedo usar em cada tecla. Para isso acertar, ele
      precisa saber que teclado está na sua frente.
    </p>

  </main>

  <footer class="rodape" data-i18n="rodape.texto">
    Feito em português, sem depender de nada externo.
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
