<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>digita. — treino de digitação em português</title>
  <meta name="description" content="Treino de digitação em português do Brasil, com foco em acentos, Ç e nas diferenças entre o teclado ABNT2 e o americano.">

  <!-- Escolhe o tema ANTES de a página aparecer, para não piscar branco em
       quem usa o modo escuro. É o único JavaScript fora da pasta js/, e ele
       precisa estar aqui: qualquer coisa carregada depois já seria tarde.
       A regra é a mesma do app.js (ver a seção Tema lá): a escolha manual
       só vale enquanto o sistema continuar no tema que tinha quando ela foi
       feita. Ela está repetida aqui porque isto roda antes de tudo. -->
  <script>
    (function () {
      var salvo = {};
      try {
        salvo = JSON.parse(localStorage.getItem('digita:config') || '{}');
      } catch (erro) {
        /* navegador sem localStorage: segue o sistema */
      }
      var sistema =
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';

      document.documentElement.dataset.tema =
        salvo.tema && salvo.temaDoSistemaNaEscolha === sistema ? salvo.tema : sistema;
    })();
  </script>

  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="./css/tema.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/componentes.css">
  <link rel="stylesheet" href="./css/teclado.css">
  <link rel="stylesheet" href="./css/telas.css">
</head>
<body>

  <!-- Ícones do site. Ficam aqui dentro, desenhados uma vez, e são reusados
       com <use href="#icone-x">. Sem arquivo externo: nada a baixar, e
       funciona igual em qualquer navegador. -->
  <svg class="sprite-icones" aria-hidden="true" focusable="false">
    <symbol id="icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </symbol>
    <symbol id="icone-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path>
    </symbol>
    <symbol id="icone-som" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path>
      <path d="M16 9.2a4 4 0 0 1 0 5.6"></path>
      <path d="M18.6 6.6a7.5 7.5 0 0 1 0 10.8"></path>
    </symbol>
    <symbol id="icone-mudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"></path>
      <path d="M16.5 9.5l5 5M21.5 9.5l-5 5"></path>
    </symbol>
    <symbol id="icone-estrela" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"></path>
    </symbol>
  </svg>

  <header class="cabecalho">
    <a class="marca" href="./">digita<span class="marca-ponto">.</span></a>

    <nav class="cabecalho-acoes">
      <div class="seletor" role="group" data-i18n-aria="cabecalho.idioma" aria-label="Idioma da interface">
        <button type="button" class="seletor-opcao" data-idioma="pt" aria-pressed="true">PT</button>
        <button type="button" class="seletor-opcao" data-idioma="en" aria-pressed="false">EN</button>
      </div>

      <button type="button" class="botao-icone" id="botao-som" data-i18n-aria="som.silenciar" aria-label="Silenciar os sons" aria-pressed="false">
        <svg aria-hidden="true"><use href="#icone-som"></use></svg>
      </button>

      <button type="button" class="botao-icone" id="botao-tema" data-i18n-aria="cabecalho.alternarTema" aria-label="Alternar entre modo claro e escuro">
        <svg aria-hidden="true"><use href="#icone-lua"></use></svg>
      </button>
    </nav>
  </header>

  <!-- Todas as telas do site aparecem dentro deste <main>, trocadas pelo
       JavaScript. O conteúdo escrito aqui é só o que se vê enquanto o
       JavaScript não carregou. -->
  <main class="conteudo" id="tela">

    <!-- Reserva, para quem chega antes do JavaScript carregar. -->
    <p class="ajuda" data-i18n="entrada.subtitulo">
      O digita. mostra qual dedo usar em cada tecla. Para isso acertar, ele
      precisa saber que teclado está na sua frente.
    </p>

  </main>

  <footer class="rodape" data-i18n="rodape.texto">
    Feito em português, sem depender de nada externo.
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
