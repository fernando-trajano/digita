<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rascunho — Cobra</title>

<script>
  document.documentElement.dataset.tema =
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
</script>

<style>
/* ==========================================================================
   RASCUNHO — o jogo Cobra, modo Fuga.

   Arquivo único e autocontido. Nada daqui está ligado ao digita. de verdade.

   Copiados do site, sem alterar nada: as variáveis do tema.css, a
   tipografia e o desenho das letras do texto da lição (certa, da vez,
   que falta, errada). Do reset do base.css ficou de fora, de propósito, a
   media query de prefers-reduced-motion — é regra desta tarefa.

   Só o modo Fuga. Corrida, Reflexo e Desafio do dia ficam para depois.
   ========================================================================== */

/* ==========================================================================
   tema.css — copiado do site, byte por byte.
   ========================================================================== */

/* ==========================================================================
   tema.css — o único arquivo que conhece cores.

   REGRA DO PROJETO: nenhum outro CSS pode escrever uma cor literal (#FFFFFF).
   Todo o resto do site usa var(--nome-da-variavel). Assim, para mudar a
   aparência inteira do digita., basta mexer aqui.

   Como funciona o modo claro/escuro:
   - :root guarda a paleta CLARA (o padrão).
   - :root[data-tema="escuro"] regrava só as cores que mudam.
   - Um script pequeno no <head> do index.html escolhe o tema antes da página
     aparecer, para não piscar branco em quem usa o modo escuro.
   ========================================================================== */

:root {
  /* Avisa ao navegador qual é o tema, para barras de rolagem e campos de
     formulário combinarem com a página. */
  color-scheme: light;

  /* --- Superfícies e texto (modo claro) ------------------------------- */
  --cor-fundo: #FFFFFF;             /* fundo da página */
  --cor-superficie: #F4F4F5;        /* áreas destacadas e teclas neutras */
  --cor-borda: #E4E4E7;             /* bordas e linhas finas */
  --cor-texto: #18181B;             /* texto principal */
  --cor-texto-secundario: #52525B;  /* texto secundário */
  --cor-texto-discreto: #71717A;    /* legendas e textos discretos */
  --cor-letra-pendente: #8E8E96;    /* letras ainda não digitadas (fonte grande) */
  --cor-licao-feita: #444444;       /* nome de uma lição já feita, na trilha */

  --cor-botao-fundo: #18181B;
  --cor-botao-texto: #FFFFFF;
  --cor-botao-secundario-borda: #D4D4D8;

  /* --- Cores dos dedos (fundo da tecla / texto da tecla) --------------- */
  --dedo-minimo-fundo: #EDE9FE;     /* mínimo — violeta */
  --dedo-minimo-texto: #5B21B6;

  --dedo-anelar-fundo: #DBEAFE;     /* anelar — azul */
  --dedo-anelar-texto: #1E40AF;

  --dedo-medio-fundo: #CCFBF1;      /* médio — verde-água */
  --dedo-medio-texto: #115E59;

  --dedo-indicador-fundo: #DCFCE7;  /* indicador — verde */
  --dedo-indicador-texto: #166534;

  --dedo-neutro-fundo: #F4F4F5;     /* polegar e teclas neutras — cinza */
  --dedo-neutro-texto: #52525B;

  /* --- Erro ------------------------------------------------------------ */
  --cor-erro-fundo: #FEE2E2;
  --cor-erro-texto: #B91C1C;

  /* --- Fontes do sistema (nada é baixado) ------------------------------ */
  /* Títulos e texto usam a mesma família: a diferença vem do peso e do
     tamanho, não de uma fonte decorativa. */
  --fonte-titulo: system-ui, -apple-system, "Segoe UI", sans-serif;
  --fonte-texto: system-ui, -apple-system, "Segoe UI", sans-serif;
  --fonte-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --peso-titulo: 600;
  --espacamento-titulo: -0.02em;

  /* --- Espaçamentos ---------------------------------------------------- */
  --esp-1: 0.25rem;
  --esp-2: 0.5rem;
  --esp-3: 0.75rem;
  --esp-4: 1rem;
  --esp-5: 1.5rem;
  --esp-6: 2rem;
  --esp-7: 3rem;
  --esp-8: 4rem;

  /* --- Formas e medidas ------------------------------------------------ */
  --raio-p: 6px;
  --raio-m: 10px;
  --raio-g: 16px;
  --borda: 1px solid var(--cor-borda);
  --largura-max: 1100px;        /* largura máxima do conteúdo */
  --largura-teclado-max: 960px; /* largura máxima do teclado na lição */

  /* O texto da lição: grande o bastante para as letras que faltam terem
     contraste, e para se enxergar sem baixar os olhos do teclado. */
  --tamanho-texto-licao: clamp(1.6rem, 4cqw, 2.4rem);

  /* As duas mãos juntas, ao lado do texto da lição. */
  --largura-maos: 107px;

  /* --- Movimento ------------------------------------------------------- */
  --transicao: 150ms ease;

  /* Só para a troca das ilustrações do treino livre: um fade de 150ms fica
     nervoso quando o desenho inteiro troca. */
  --transicao-lenta: 250ms ease;
}

/* ==========================================================================
   Modo escuro — só o que muda em relação ao claro.
   ========================================================================== */

:root[data-tema="escuro"] {
  color-scheme: dark;

  --cor-fundo: #1F1F1D;
  --cor-superficie: #2C2C2A;
  --cor-borda: #444441;
  --cor-texto: #F1EFE8;
  --cor-texto-secundario: #B4B2A9;
  --cor-texto-discreto: #888780;
  --cor-letra-pendente: #888780;
  /* No escuro o tom da lição feita precisa CLAREAR, e não escurecer: um
     cinza-escuro sobre fundo escuro sumiria. */
  --cor-licao-feita: #B4B2A9;

  --cor-botao-fundo: #F1EFE8;
  --cor-botao-texto: #2C2C2A;
  --cor-botao-secundario-borda: #444441;

  --dedo-minimo-fundo: #3C3489;
  --dedo-minimo-texto: #CECBF6;

  --dedo-anelar-fundo: #0C447C;
  --dedo-anelar-texto: #B5D4F4;

  --dedo-medio-fundo: #085041;
  --dedo-medio-texto: #9FE1CB;

  --dedo-indicador-fundo: #27500A;
  --dedo-indicador-texto: #C0DD97;

  --dedo-neutro-fundo: #444441;
  --dedo-neutro-texto: #D3D1C7;

  --cor-erro-fundo: #791F1F;
  --cor-erro-texto: #F7C1C1;
}

/* Rede de segurança: se o JavaScript não rodar, quem usa o sistema no escuro
   ainda recebe o tema escuro. */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema]) {
    color-scheme: dark;

    --cor-fundo: #1F1F1D;
    --cor-superficie: #2C2C2A;
    --cor-borda: #444441;
    --cor-texto: #F1EFE8;
    --cor-texto-secundario: #B4B2A9;
    --cor-texto-discreto: #888780;
    --cor-letra-pendente: #888780;
    --cor-licao-feita: #B4B2A9;

    --cor-botao-fundo: #F1EFE8;
    --cor-botao-texto: #2C2C2A;
    --cor-botao-secundario-borda: #444441;

    --dedo-minimo-fundo: #3C3489;
    --dedo-minimo-texto: #CECBF6;

    --dedo-anelar-fundo: #0C447C;
    --dedo-anelar-texto: #B5D4F4;

    --dedo-medio-fundo: #085041;
    --dedo-medio-texto: #9FE1CB;

    --dedo-indicador-fundo: #27500A;
    --dedo-indicador-texto: #C0DD97;

    --dedo-neutro-fundo: #444441;
    --dedo-neutro-texto: #D3D1C7;

    --cor-erro-fundo: #791F1F;
    --cor-erro-texto: #F7C1C1;
  }
}

/* ==========================================================================
   base.css e componentes.css — o que esta tela usa, copiado do site.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;

  background-color: var(--cor-fundo);
  color: var(--cor-texto);
  font-family: var(--fonte-texto);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }

h1, h2 {
  font-family: var(--fonte-titulo);
  font-weight: var(--peso-titulo);
  line-height: 1.2;
  letter-spacing: var(--espacamento-titulo);
}

h1 { font-size: clamp(1.9rem, 1.4rem + 2vw, 2.6rem); }
p { max-width: 62ch; }
a { color: inherit; text-underline-offset: 0.2em; }

:focus-visible {
  outline: 2px solid var(--cor-texto);
  outline-offset: 2px;
  border-radius: var(--raio-p);
}

.cabecalho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--esp-4);
  padding: var(--esp-4) var(--esp-5);
  border-bottom: var(--borda);
  background-color: var(--cor-fundo);
}

.marca {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  white-space: nowrap;
  font-family: var(--fonte-titulo);
  font-size: 1.25rem;
  font-weight: var(--peso-titulo);
  letter-spacing: var(--espacamento-titulo);
  text-decoration: none;
  color: inherit;
}

.marca-icone { width: 22px; height: 22px; flex: 0 0 auto; }
.marca-ponto { color: var(--cor-texto-discreto); }
.cabecalho-acoes { display: flex; align-items: center; gap: var(--esp-3); }

.botao-icone {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  border: var(--borda);
  border-radius: var(--raio-p);
  background-color: transparent;
  color: var(--cor-texto-secundario);
  cursor: pointer;
  transition: color var(--transicao), border-color var(--transicao);
}

.botao-icone svg { width: 1.125rem; height: 1.125rem; }
.botao-icone:hover { color: var(--cor-texto); border-color: var(--cor-texto-secundario); }

.rascunho-aviso {
  max-width: none;
  padding: var(--esp-2) var(--esp-5);
  border-bottom: var(--borda);
  color: var(--cor-texto-discreto);
  font-size: 0.75rem;
  text-align: center;
}

.conteudo {
  flex: 1;
  width: 100%;
  max-width: var(--largura-max);
  margin-inline: auto;
  padding: var(--esp-6) var(--esp-5) var(--esp-7);
}

.botao {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--esp-2);
  padding: var(--esp-3) var(--esp-5);
  border: 1px solid var(--cor-botao-secundario-borda);
  border-radius: var(--raio-p);
  background-color: transparent;
  color: var(--cor-texto);
  font-size: 0.95rem;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--transicao), border-color var(--transicao);
}

.botao:hover { border-color: var(--cor-texto-secundario); }

.botao--principal {
  border-color: var(--cor-botao-fundo);
  background-color: var(--cor-botao-fundo);
  color: var(--cor-botao-texto);
}

.botao--principal:hover { opacity: 0.88; }
.ajuda { color: var(--cor-texto-discreto); font-size: 0.9rem; }

.sem-teclado {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--esp-4);
  max-width: 40rem;
  padding-block: var(--esp-6);
}


/* ==========================================================================
   A tela de começo — o mesmo desenho da tela de começo da Fila e da Cadeia.
   ========================================================================== */

.cobra-inicio { max-width: 40rem; }

.subtitulo {
  margin-top: var(--esp-2);
  color: var(--cor-texto-secundario);
}

.cobra-inicio .ajuda { margin-top: var(--esp-3); }

.cobra-grupo { margin-top: var(--esp-6); }

.cobra-rotulo {
  margin-bottom: var(--esp-3);
  color: var(--cor-texto-discreto);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Cada nível já é a entrada da partida: nenhum fica marcado como
   "escolhido", e o sublinhado aparece só sob o mouse ou o foco. */
.cobra-niveis { display: flex; flex-wrap: wrap; gap: var(--esp-5); }

.cobra-nivel {
  padding: 0;
  border: 0;
  background: none;
  color: var(--cor-texto-secundario);
  font: inherit;
  font-size: 0.95rem;
  cursor: pointer;
  transition: color var(--transicao);
}

.cobra-nivel:hover,
.cobra-nivel:focus-visible {
  color: var(--cor-texto);
  box-shadow: inset 0 -2px 0 var(--cor-texto);
}

/* A conta da adaptação, embaixo dos níveis: a sua média e a da cobra. */
.cobra-conta { margin-top: var(--esp-4); }

.cobra-conta strong {
  color: var(--cor-texto);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.cobra-acoes {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--esp-5);
  margin-top: var(--esp-6);
}

.cobra-voltar {
  color: var(--cor-texto-discreto);
  font-size: 0.85rem;
}

.cobra-voltar:hover { color: var(--cor-texto); }

/* ==========================================================================
   A PARTIDA — a pista em cima, o texto embaixo.
   ========================================================================== */

.cobra-jogo {
  /* O tamanho da letra da lição (--tamanho-texto-licao) é medido na
     largura desta área, como no site. */
  container-type: inline-size;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--esp-4);
}

.cobra-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--esp-4);
  width: 100%;
  max-width: 62rem;
}

.medidas {
  display: flex;
  flex-wrap: wrap;
  gap: var(--esp-5);
  color: var(--cor-texto-discreto);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.medida strong {
  margin-right: var(--esp-1);
  color: var(--cor-texto);
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}

.cobra-encerrar {
  padding: 0;
  border: 0;
  background: none;
  color: var(--cor-texto-discreto);
  font: inherit;
  font-size: 0.85rem;
  text-decoration: underline;
  text-underline-offset: 0.2em;
  cursor: pointer;
}

.cobra-encerrar:hover { color: var(--cor-texto); }

/* --- A pista ----------------------------------------------------------------

   Um SVG só, desenhado em traço fino como as ilustrações: o chão, as marcas
   de distância, a cobra e o ponto. As posições são escritas pelo JS a cada
   quadro. */

.cobra-pista {
  width: 100%;
  max-width: 62rem;
  height: auto;
  overflow: hidden;
}

.cobra-chao {
  stroke: var(--cor-borda);
  stroke-width: 1;
}

.cobra-marca {
  stroke: var(--cor-borda);
  stroke-width: 1;
}

.cobra-marca--grande { stroke: var(--cor-texto-discreto); }

.cobra-rotulo-marca {
  fill: var(--cor-texto-discreto);
  font-family: var(--fonte-texto);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* A cobra: um traço. A cor, a espessura e a opacidade não estão aqui —
   elas dependem da distância e são escritas pelo JS (ver `desenharCobra`),
   sempre misturando --cor-texto-secundario e --cor-texto. Nenhuma cor nova. */
.cobra-corpo {
  fill: none;
  stroke: var(--cor-texto-secundario);
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* O ponto de quem joga. A cor é a do PRÓXIMO dedo, escrita pelo JS. */
.cobra-jogador { fill: var(--dedo-neutro-texto); }

/* --- O aviso (Caps Lock, pausa) e o texto -------------------------------- */

.cobra-aviso {
  max-width: none;
  min-height: 1.4em;
  color: var(--cor-texto-secundario);
  font-size: 0.9rem;
  text-align: center;
}

/* O texto corre numa linha só, como uma fita: o cursor fica parado a 40%
   da largura e as letras andam para a esquerda a cada acerto — o mesmo
   sentido em que o ponto foge. */
.cobra-texto {
  container-type: inline-size;
  width: 100%;
  max-width: 62rem;
  overflow: hidden;
}

.cobra-linha {
  max-width: none;
  margin: 0;
  font-family: var(--fonte-mono);
  font-size: var(--tamanho-texto-licao);
  line-height: 1.7;
  letter-spacing: 0.02em;
  white-space: pre;
  transform: translateX(calc(40cqw - var(--posicao, 0) * (1ch + 0.02em)));
  transition: transform var(--transicao);
}

/* As letras: copiadas do telas.css do site, sem mudar nada. */
.letra--certa { color: var(--cor-texto); }

.letra--atual {
  color: var(--cor-letra-pendente);
  box-shadow: inset 0 -3px 0 var(--cor-texto);
}

.letra--falta { color: var(--cor-letra-pendente); }

.letra--errada {
  background-color: var(--cor-erro-fundo);
  color: var(--cor-erro-texto);
  border-radius: var(--raio-p);
}

.letra--espaco.letra--atual,
.letra--espaco.letra--errada {
  background-color: var(--cor-superficie);
  border-radius: var(--raio-p);
}

.letra--espaco.letra--errada { background-color: var(--cor-erro-fundo); }

.cobra-dica {
  max-width: none;
  min-height: 1.5em;
  text-align: center;
}

/* ==========================================================================
   O fim — texto, e nada mais.
   ========================================================================== */

/* Cinco números: a área é mais larga e o vão entre eles menor que na Fila,
   para os cinco caberem numa linha só. */
.cobra-fim { max-width: 50rem; }

.cobra-numeros {
  display: flex;
  flex-wrap: wrap;
  gap: var(--esp-6);
  margin: var(--esp-5) 0;
  padding-block: var(--esp-5);
  border-top: var(--borda);
  border-bottom: var(--borda);
}

.cobra-numero {
  font-family: var(--fonte-titulo);
  font-weight: var(--peso-titulo);
  font-size: 2rem;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.cobra-numero small {
  color: var(--cor-texto-discreto);
  font-size: 1.1rem;
  font-weight: 400;
}

.apenas-leitor-de-tela {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
</style>
</head>

<main class="conteudo" id="tela"></main>

<script>
/* ==========================================================================
   RASCUNHO — Cobra, modo Fuga (sem fim).

   A cobra avança da esquerda para a direita, em velocidade constante. Quem
   joga é um ponto à frente dela. Cada acerto afasta o ponto — quanto mais
   rápido o acerto, maior o salto —, cada erro o faz recuar. A cobra
   alcançar o ponto encerra a partida.
   ========================================================================== */

/* --------------------------------------------------------------------------
   A MÉDIA DE QUEM JOGA — é por ela que a cobra se adapta.
   -------------------------------------------------------------------------- */

/**
 * A média de PPM de quem joga (palavras por minuto).
 *
 * NO RASCUNHO, ESTE É UM VALOR DE EXEMPLO. No site de verdade, ele vai sair
 * das lições que a pessoa já fez. Aqui ele fica fixo para você ver a
 * adaptação funcionando:
 *
 *   - troque o 30 por 15 (quem está começando) ou por 60 (quem já digita
 *     bem), salve e recarregue a página: a cobra muda de velocidade;
 *
 *   - ou, sem editar nada, ponha ?ppm= no fim do endereço:
 *       jogo-cobra.html?ppm=15
 *       jogo-cobra.html?ppm=60
 *
 * A tela de começo mostra a conta inteira: a sua média e a velocidade da
 * cobra no nível escolhido, as duas em PPM.
 */
const PPM_MEDIO_DE_EXEMPLO = 30;

/** Lê a média: o ?ppm= do endereço, se houver; senão, o exemplo acima. */
function lerPpmMedio() {
  const daUrl = Number(new URLSearchParams(window.location.search).get('ppm'));
  const ppm = Number.isFinite(daUrl) && daUrl > 0 ? daUrl : PPM_MEDIO_DE_EXEMPLO;
  // Abaixo de 10 ou acima de 150, a conta deixa de fazer sentido.
  return Math.min(150, Math.max(10, Math.round(ppm)));
}

const PPM_MEDIO = lerPpmMedio();

/** Quantos caracteres valem uma "palavra" na conta de PPM — como no site. */
const CARACTERES_POR_PALAVRA = 5;

/** O ritmo médio de quem joga: segundos entre um caractere e o próximo. */
const RITMO = 60 / (PPM_MEDIO * CARACTERES_POR_PALAVRA);

/* --------------------------------------------------------------------------
   AS REGRAS, em números.
   -------------------------------------------------------------------------- */

/**
 * O nível muda UMA coisa: a velocidade da cobra, como FRAÇÃO da sua média —
 * nunca um PPM fixo. É isso que dá a mesma tensão para quem digita a 15 e
 * a 80 PPM: um valor absoluto seria impossível para quem começa e fácil
 * demais para quem já é rápido.
 *
 *   Fácil    80% do seu ritmo: no seu normal, você abre distância.
 *   Médio   110%: a cobra é mais rápida que você. Só os saltos dos acertos
 *           rápidos e o fôlego dos combos te mantêm à frente.
 *   Difícil 130%: é preciso digitar bem acima da sua média, e sem errar.
 */
const NIVEIS = {
  facil:   { nome: 'Fácil',   fracao: 0.8 },
  medio:   { nome: 'Médio',   fracao: 1.1 },
  dificil: { nome: 'Difícil', fracao: 1.3 },
};

/** Metros que o ponto avança num acerto feito exatamente no seu ritmo. */
const SALTO = 1;

/**
 * Quanto mais rápido o acerto, maior o salto. O salto é multiplicado pela
 * raiz de (seu ritmo ÷ o tempo que a tecla levou): no dobro da sua
 * velocidade, o salto é 1,4 vez maior; na metade, 0,7. Com piso e teto,
 * para uma hesitação ainda andar um pouco e uma rajada não disparar.
 */
const SALTO_MINIMO = 0.6;
const SALTO_MAXIMO = 1.6;

/** Metros que o ponto recua num erro. */
const RECUO = 2;

/** A cada tantos acertos seguidos, um avanço extra — o fôlego do combo. */
const COMBO_A_CADA = 10;
const FOLEGO_DO_COMBO = 2;   // metros

/*
 * As distâncias entre a cobra e o ponto são medidas em SEGUNDOS DE COBRA:
 * quanto tempo ela levaria para chegar, na velocidade normal. É isso que dá
 * a mesma tensão para quem digita a 15 e a 60 PPM.
 */

/** A folga na largada. */
const FOLEGO_INICIAL = 5;

/**
 * A folga máxima. Mais longe que isso, a cobra vem junto: sem teto, quem
 * digita acima da própria média abriria distância para sempre, e a Fuga
 * perderia a tensão.
 */
const FOLEGO_MAXIMO = 8;

/** Abaixo desta folga, o traço da cobra começa a engrossar e escurecer. */
const FOLEGO_DO_ALERTA = 5;

/** Abaixo desta folga, a cobra acelera… */
const FOLEGO_DA_ACELERACAO = 2.5;

/** …até este tanto a mais, colada no ponto (0,6 = 60% mais rápida). */
const ACELERACAO_MAXIMA = 0.6;

/** O ciclo do pulso no traço: um segundo, o mesmo das teclas modificadoras. */
const CICLO_DO_PULSO = 1;

/** Quanto a cena da captura fica parada antes do resumo, em segundos. */
const ESPERA_NO_FIM = 0.9;

/* --------------------------------------------------------------------------
   AS PALAVRAS — dados de exemplo fixos: o vocabulário do modo Adaptativo do
   Treino livre, que já está no site. Sem acento de propósito: num teclado
   americano sem o US Internacional, uma palavra acentuada trava o jogo.
   -------------------------------------------------------------------------- */

const PALAVRAS = [
  'casa', 'vida', 'tempo', 'gente', 'dia', 'noite', 'porta', 'janela',
  'papel', 'grupo', 'projeto', 'quarto', 'parque', 'aula', 'ideia',
  'moeda', 'sala', 'fala', 'salada', 'gola', 'lago', 'jogo', 'jornal',
  'juiz', 'ajuda', 'hoje', 'morro', 'mundo', 'homem', 'garfo', 'grande',
  'guarda', 'figura', 'agora', 'digital', 'ganho', 'roda', 'rosa', 'solo',
  'teste', 'tudo', 'data', 'gato', 'pato', 'dedo', 'logo',
  'quadro', 'bloco', 'bomba', 'banco', 'bairro', 'verbo', 'objeto',
  'quilo', 'queijo', 'quase', 'quinta', 'esquina', 'floresta', 'zebra',
  'zero', 'azul', 'prazer', 'beleza', 'natureza', 'dezena', 'caixa',
  'texto', 'exame', 'peixe', 'luxo', 'exato', 'baixo', 'taxa', 'vidro',
  'navio', 'vento', 'nome', 'novela', 'cinema', 'cidade', 'comida',
  'carro', 'escola', 'calma', 'vizinho', 'xadrez', 'xarope',
];

/**
 * O dedo de cada letra — a divisão do dados/layouts/dedos.js do site. As
 * letras de A a Z ficam no mesmo lugar no ABNT2 e no americano, então o
 * mapa vale para os dois. O espaço é do polegar, cinza como no site.
 */
const DEDO_DA_LETRA = {
  q: 'minimo', a: 'minimo', z: 'minimo',
  w: 'anelar', s: 'anelar', x: 'anelar',
  e: 'medio', d: 'medio', c: 'medio',
  r: 'indicador', t: 'indicador', f: 'indicador', g: 'indicador', v: 'indicador', b: 'indicador',
  y: 'indicador', u: 'indicador', h: 'indicador', j: 'indicador', n: 'indicador', m: 'indicador',
  i: 'medio', k: 'medio',
  o: 'anelar', l: 'anelar',
  p: 'minimo',
  ' ': 'neutro',
};

/** A cor do dedo, sempre por variável: o tom forte (o do texto da tecla). */
function corDoDedo(caractere) {
  return `var(--dedo-${DEDO_DA_LETRA[caractere] ?? 'neutro'}-texto)`;
}

/* --------------------------------------------------------------------------
   A PISTA — as medidas do desenho, no sistema de coordenadas do SVG.
   -------------------------------------------------------------------------- */

const PISTA = {
  largura: 1000,
  altura: 150,
  eixo: 62,            // a altura por onde a cobra e o ponto correm
  chao: 112,           // a linha fina do chão
  xDoPonto: 780,       // onde a câmera deixa o ponto, parado
  xDaCobraNoMaximo: 90, // onde fica a cabeça da cobra com a folga máxima
  xMaximoDoPonto: 960, // o ponto nunca sai pela direita
};

/** O corpo da cobra: comprimento, ondulação e altura das curvas. */
const CORPO = {
  comprimento: 340,
  passo: 5,
  onda: 120,           // a distância entre duas curvas, em unidades do SVG
  altura: 18,
  pescoco: 60,         // perto da cabeça a curva abre aos poucos: ela aponta para o ponto
};

/** Espessura do traço: longe e colada no ponto. */
const TRACO_LONGE = 1.6;
const TRACO_PERTO = 4.2;

/* ==========================================================================
   SOM — Web Audio. O contexto só nasce no primeiro som, e o primeiro som
   só acontece depois de uma tecla: nada toca antes da primeira interação.
   ========================================================================== */

let audio = null;

function tocarTom({ onda = 'sine', frequencia, duracao, ganho, atraso = 0 }) {
  if (estadoSalvo.mudo) return;

  const Contexto = window.AudioContext || window.webkitAudioContext;
  if (!Contexto) return;

  audio = audio ?? new Contexto();
  if (audio.state === 'suspended') audio.resume();

  const agora = audio.currentTime + atraso;
  const oscilador = audio.createOscillator();
  const envelope = audio.createGain();

  oscilador.type = onda;
  oscilador.frequency.value = frequencia;

  envelope.gain.setValueAtTime(0.0001, agora);
  envelope.gain.exponentialRampToValueAtTime(ganho, agora + 0.008);
  envelope.gain.exponentialRampToValueAtTime(0.0001, agora + duracao);

  oscilador.connect(envelope).connect(audio.destination);
  oscilador.start(agora);
  oscilador.stop(agora + duracao + 0.02);
}

/** Acerto: o clique seco do site. */
function tocarAcerto() {
  tocarTom({ frequencia: 1050, duracao: 0.035, ganho: 0.1 });
}

/** O fôlego do combo: as duas primeiras notas da conclusão do site, rápidas. */
function tocarCombo() {
  [659.25, 783.99].forEach((frequencia, i) => {
    tocarTom({ frequencia, duracao: 0.12, ganho: 0.07, atraso: 0.04 + i * 0.07 });
  });
}

/** Erro: o do site — grave, curto e baixo. */
function tocarErro() {
  tocarTom({ frequencia: 180, duracao: 0.12, ganho: 0.09 });
}

/** A cobra alcançou: as notas da conclusão, ao contrário e mais graves. */
function tocarCaptura() {
  [392.0, 329.63, 261.63].forEach((frequencia, i) => {
    tocarTom({ frequencia, duracao: 0.2, ganho: 0.08, atraso: i * 0.12 });
  });
}

/* ==========================================================================
   O QUE FICA SALVO — simulado em digita:jogos, e só lá.
   ========================================================================== */

const CHAVE = 'digita:jogos';

function lerSalvo() {
  try {
    return JSON.parse(localStorage.getItem(CHAVE) || '{}');
  } catch (erro) {
    return {};
  }
}

let estadoSalvo = lerSalvo();
if (!NIVEIS[estadoSalvo.nivelCobra]) estadoSalvo.nivelCobra = 'medio';

function guardar(mudancas) {
  estadoSalvo = { ...lerSalvo(), ...estadoSalvo, ...mudancas };
  try {
    localStorage.setItem(CHAVE, JSON.stringify(estadoSalvo));
  } catch (erro) {
    /* sem localStorage: vale só nesta visita */
  }
}

const tela = document.querySelector('#tela');

/* ==========================================================================
   TELA 1 — o começo: o nível, e a conta da adaptação
   ========================================================================== */

/** A velocidade da cobra, em PPM, num nível. */
function ppmDaCobra(nivel) {
  return Math.round(PPM_MEDIO * NIVEIS[nivel].fracao);
}

function mostrarInicio() {
  encerrarPartida();

  tela.replaceChildren();
  tela.insertAdjacentHTML('beforeend', `
    <div class="cobra-inicio">
      <h1>Cobra</h1>
      <p class="subtitulo">A cobra vem atrás em velocidade constante. Cada acerto te afasta, cada erro te aproxima.</p>
      <p class="ajuda">
        Modo Fuga, sem fim. Quanto mais rápido o acerto, maior o salto; a cada
        ${COMBO_A_CADA} acertos seguidos, um fôlego extra. Quando a cobra chega perto, ela acelera.
      </p>

      <div class="cobra-grupo">
        <p class="cobra-rotulo">Nível</p>
        <div class="cobra-niveis">
          ${Object.entries(NIVEIS).map(([id, nivel]) => `
            <button type="button" class="cobra-nivel" data-nivel="${id}">${nivel.nome}</button>`).join('')}
        </div>
        <p class="ajuda cobra-conta" data-papel="conta"></p>
      </div>

      <div class="cobra-acoes">
        <a class="cobra-voltar" href="jogos.html">Voltar aos jogos</a>
      </div>
    </div>
  `);

  /*
   * A linha da conta. A sua média fica SEMPRE à vista — sem mouse (num
   * celular com teclado, por exemplo), é o que ela mostra. Com o mouse (ou
   * o foco do Tab) sobre um nível, ela se completa com a velocidade da
   * cobra naquele nível. Nenhuma informação existe só no hover: a média,
   * que é a informação de verdade, não depende dele.
   */
  const conta = tela.querySelector('[data-papel="conta"]');

  function escreverConta(nivel = null) {
    conta.innerHTML = `Sua média: <strong>${PPM_MEDIO} PPM</strong>.`
      + (nivel ? ` No nível ${NIVEIS[nivel].nome}, a cobra corre a <strong>${ppmDaCobra(nivel)} PPM</strong>.` : '');
  }

  // Clicar no nível já entra na partida — não há um segundo clique.
  for (const botao of tela.querySelectorAll('[data-nivel]')) {
    const nivel = botao.dataset.nivel;

    botao.addEventListener('mouseenter', () => escreverConta(nivel));
    botao.addEventListener('focus', () => escreverConta(nivel));
    botao.addEventListener('mouseleave', () => escreverConta());
    botao.addEventListener('blur', () => escreverConta());

    botao.addEventListener('click', () => {
      guardar({ nivelCobra: nivel });
      mostrarPartida();
    });
  }

  escreverConta();
}

/* ==========================================================================
   TELA 2 — a partida
   ========================================================================== */

let partida = null;

function encerrarPartida() {
  if (!partida) return;

  cancelAnimationFrame(partida.quadro);
  window.removeEventListener('keydown', partida.aoTeclar);
  window.removeEventListener('keyup', partida.aoSoltar);
  window.removeEventListener('blur', partida.aoSair);
  document.removeEventListener('visibilitychange', partida.aoMudarVisibilidade);
  partida = null;
}

function formatarTempo(segundos) {
  const s = Math.floor(segundos);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function mostrarPartida() {
  encerrarPartida();

  const nivelId = estadoSalvo.nivelCobra;
  const nivel = NIVEIS[nivelId];

  /** A velocidade normal da cobra, em metros por segundo. */
  const velocidade = (nivel.fracao * SALTO) / RITMO;

  /** Quantas unidades do SVG vale um metro: a folga máxima ocupa a pista. */
  const escala = (PISTA.xDoPonto - PISTA.xDaCobraNoMaximo) / (FOLEGO_MAXIMO * velocidade);

  tela.replaceChildren();
  tela.insertAdjacentHTML('beforeend', `
    <div class="cobra-jogo">
      <div class="cobra-topo">
        <div class="medidas">
          <span class="medida"><strong data-papel="tempo">0:00</strong> tempo</span>
          <span class="medida"><strong data-papel="distancia">0</strong> metros</span>
          <span class="medida"><strong data-papel="combo">0</strong> combo</span>
        </div>
        <button type="button" class="cobra-encerrar" data-acao="encerrar">Encerrar</button>
      </div>

      <svg class="cobra-pista" viewBox="0 0 ${PISTA.largura} ${PISTA.altura}" aria-hidden="true">
        <line class="cobra-chao" x1="0" x2="${PISTA.largura}" y1="${PISTA.chao}" y2="${PISTA.chao}"></line>
        <g data-papel="marcas"></g>
        <path class="cobra-corpo" data-papel="cobra"></path>
        <circle class="cobra-jogador" data-papel="jogador" r="7.5" cx="${PISTA.xDoPonto}" cy="${PISTA.eixo}"></circle>
      </svg>

      <p class="cobra-aviso" data-papel="aviso"></p>

      <div class="cobra-texto">
        <p class="cobra-linha" data-papel="linha" aria-hidden="true"></p>
      </div>

      <p class="ajuda cobra-dica" data-papel="dica">A cobra sai quando você digitar a primeira letra.</p>

      <p class="apenas-leitor-de-tela" data-papel="leitor" role="status"></p>
    </div>
  `);

  const partes = {
    tempo: tela.querySelector('[data-papel="tempo"]'),
    distancia: tela.querySelector('[data-papel="distancia"]'),
    combo: tela.querySelector('[data-papel="combo"]'),
    marcas: tela.querySelector('[data-papel="marcas"]'),
    cobra: tela.querySelector('[data-papel="cobra"]'),
    jogador: tela.querySelector('[data-papel="jogador"]'),
    aviso: tela.querySelector('[data-papel="aviso"]'),
    linha: tela.querySelector('[data-papel="linha"]'),
    dica: tela.querySelector('[data-papel="dica"]'),
    leitor: tela.querySelector('[data-papel="leitor"]'),
  };

  /* --- O texto: uma fita de palavras que nunca acaba ------------------- */

  let texto = '';
  const letras = [];      // um <span> por caractere
  let posicao = 0;

  function acrescentarPalavras(quantas) {
    const pedaco = [];
    for (let i = 0; i < quantas; i++) {
      let palavra;
      do {
        palavra = PALAVRAS[Math.floor(Math.random() * PALAVRAS.length)];
      } while (palavra === pedaco.at(-1));
      pedaco.push(palavra);
    }

    const novo = (texto ? ' ' : '') + pedaco.join(' ');
    const fragmento = document.createDocumentFragment();

    for (const caractere of novo) {
      const span = document.createElement('span');
      span.textContent = caractere;
      span.className = caractere === ' ' ? 'letra--falta letra--espaco' : 'letra--falta';
      letras.push(span);
      fragmento.append(span);
    }

    texto += novo;
    partes.linha.append(fragmento);
  }

  acrescentarPalavras(40);

  /* --- O estado ------------------------------------------------------- */

  // Posições em metros, na pista. O ponto larga no zero.
  let jogador = 0;
  let cobra = -FOLEGO_INICIAL * velocidade;

  // O que aparece: o ponto desliza até a posição de verdade, e a câmera
  // vem atrás dele, um pouco mais devagar — é o que deixa ver o salto.
  let jogadorNaTela = jogador;
  let camera = jogador;

  let comecou = false;
  let pausado = false;
  let capturado = false;
  let relogio = 0;          // segundos de jogo, desde a primeira tecla
  let tempoDeTela = 0;      // segundos desde a abertura, para a ondulação
  let fimDaCaptura = null;
  let ultimoQuadro = null;
  let ultimaTecla = null;   // o instante do último acerto, no relógio do jogo
  let fase = 0;             // a fase da ondulação da cobra
  let multiplicador = 1;    // a aceleração da cobra, agora
  let pertoAnunciado = false;

  let acertos = 0;
  let erros = 0;
  let combo = 0;
  let comboMaximo = 0;
  let erroNaLetraDaVez = false;

  /** A folga de agora, em segundos de cobra. */
  const folego = () => (jogador - cobra) / velocidade;

  /** O instante de agora no relógio do jogo, entre um quadro e outro. */
  function agora() {
    if (ultimoQuadro === null) return relogio;
    return relogio + Math.min(0.1, Math.max(0, (performance.now() - ultimoQuadro) / 1000));
  }

  /* --- A fita de texto ------------------------------------------------ */

  function marcarLetraDaVez() {
    const span = letras[posicao];
    span.classList.remove('letra--falta');
    span.classList.add('letra--atual');
    partes.linha.style.setProperty('--posicao', posicao);
    partes.jogador.style.fill = corDoDedo(texto[posicao]);
  }

  marcarLetraDaVez();

  /* --- O relógio --------------------------------------------------------

     O tempo sai de performance.now(), pelo argumento do
     requestAnimationFrame — nunca da contagem de quadros. Tudo o que anda é
     velocidade × tempo, e as suavizações são exponenciais no tempo: numa
     tela de 60 Hz e numa de 144 Hz, a cobra chega no mesmo segundo. O teto
     de 0,1s por quadro evita que uma volta de outra aba faça a cobra pular.
     ---------------------------------------------------------------------- */

  function quadro(instante) {
    const passo = ultimoQuadro === null ? 0 : Math.min(0.1, (instante - ultimoQuadro) / 1000);
    ultimoQuadro = instante;

    if (!pausado) {
      tempoDeTela += passo;

      if (capturado) {
        if (relogio + passo >= fimDaCaptura) {
          terminar(true);
          return;
        }
        relogio += passo;
      } else if (comecou) {
        relogio += passo;
        moverCobra(passo);
      }

      // O ponto e a câmera, suavizados no tempo.
      jogadorNaTela += (jogador - jogadorNaTela) * (1 - Math.exp(-passo / 0.06));
      camera += (jogadorNaTela - camera) * (1 - Math.exp(-passo / 0.35));

      // A ondulação: devagar parada, mais rápida quando a cobra acelera.
      const ritmoDaOnda = !comecou ? 0.35 : capturado ? 0 : 1.1 * multiplicador;
      fase += 2 * Math.PI * ritmoDaOnda * passo;

      desenhar();
    }

    partida.quadro = requestAnimationFrame(quadro);
  }

  function moverCobra(passo) {
    // Perto do ponto, a cobra acelera — cada vez mais, quanto mais perto.
    const f = folego();
    multiplicador = f < FOLEGO_DA_ACELERACAO
      ? 1 + ACELERACAO_MAXIMA * (1 - Math.max(0, f) / FOLEGO_DA_ACELERACAO)
      : 1;

    cobra += velocidade * multiplicador * passo;

    if (folego() < FOLEGO_DA_ACELERACAO && !pertoAnunciado) {
      pertoAnunciado = true;
      partes.leitor.textContent = 'A cobra está perto.';
    } else if (folego() >= FOLEGO_DO_ALERTA) {
      pertoAnunciado = false;
    }

    if (cobra >= jogador) capturar();
  }

  /* --- O desenho --------------------------------------------------------

     A câmera segue o ponto: um metro de pista vira `escala` unidades do SVG,
     e o ponto fica perto do xDoPonto. Quem se move na tela é o mundo — o
     chão com as marcas e a cobra — e o ponto salta um pouco à frente a cada
     acerto, antes de a câmera alcançá-lo.
     ---------------------------------------------------------------------- */

  const naTela = (metros) => PISTA.xDoPonto + (metros - camera) * escala;

  function desenhar() {
    // O ponto.
    partes.jogador.setAttribute('cx', Math.min(PISTA.xMaximoDoPonto, naTela(jogadorNaTela)).toFixed(1));

    desenharMarcas();
    desenharCobra();

    // O topo. Na cena da captura, o tempo para no instante em que ela
    // alcançou — é o mesmo número que o resumo vai mostrar.
    partes.tempo.textContent = formatarTempo(capturado ? fimDaCaptura - ESPERA_NO_FIM : relogio);
    partes.distancia.textContent = Math.max(0, Math.floor(jogador));
    partes.combo.textContent = combo;
  }

  /** O chão: um tique a cada tantos metros, e o número a cada cinco tiques. */
  const TIQUES = [1, 2, 5, 10, 20, 50, 100];
  const tique = TIQUES.find((t) => t * escala >= 45) ?? 100;
  const marcasPool = [];

  function desenharMarcas() {
    const inicio = camera - PISTA.xDoPonto / escala;
    const fim = camera + (PISTA.largura - PISTA.xDoPonto) / escala;
    const primeiro = Math.ceil(inicio / tique) * tique;

    let i = 0;
    for (let m = primeiro; m <= fim; m += tique, i++) {
      if (!marcasPool[i]) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.innerHTML = '<line class="cobra-marca"></line><text class="cobra-rotulo-marca" text-anchor="middle"></text>';
        partes.marcas.append(g);
        marcasPool[i] = g;
      }

      const g = marcasPool[i];
      const [linha, rotulo] = g.children;
      const x = naTela(m).toFixed(1);
      const grande = Math.round(m / tique) % 5 === 0;

      g.style.display = '';
      linha.setAttribute('x1', x);
      linha.setAttribute('x2', x);
      linha.setAttribute('y1', PISTA.chao);
      linha.setAttribute('y2', PISTA.chao + (grande ? 9 : 5));
      linha.classList.toggle('cobra-marca--grande', grande);

      rotulo.setAttribute('x', x);
      rotulo.setAttribute('y', PISTA.chao + 24);
      rotulo.textContent = grande && m >= 0 ? `${Math.round(m)} m` : '';
    }

    for (; i < marcasPool.length; i++) marcasPool[i].style.display = 'none';
  }

  /**
   * A cobra: um traço só, serpenteando atrás da cabeça.
   *
   * O ALERTA É SÓ PESO E OPACIDADE, SEM COR NOVA. A proximidade (de 0,
   * longe, a 1, colada) engrossa o traço e mistura --cor-texto-secundario
   * com --cor-texto — as duas cores que o tema já tem. Por cima, um pulso
   * de um segundo na opacidade, tanto mais fundo quanto mais perto.
   */
  function desenharCobra() {
    const cabeca = capturado ? naTela(jogadorNaTela) : naTela(cobra);

    let d = '';
    for (let s = 0; s <= CORPO.comprimento; s += CORPO.passo) {
      const abertura = Math.min(1, s / CORPO.pescoco);
      const x = cabeca - s;
      const y = PISTA.eixo + CORPO.altura * abertura * Math.sin((2 * Math.PI * s) / CORPO.onda - fase);
      d += `${s === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    partes.cobra.setAttribute('d', d);

    const proximidade = capturado
      ? 1
      : Math.min(1, Math.max(0, 1 - folego() / FOLEGO_DO_ALERTA));

    const pulso = 0.5 - 0.5 * Math.cos((2 * Math.PI * tempoDeTela) / CICLO_DO_PULSO); // 0 → 1 → 0, em 1s

    partes.cobra.style.strokeWidth = (TRACO_LONGE + (TRACO_PERTO - TRACO_LONGE) * proximidade).toFixed(2);
    partes.cobra.style.stroke =
      `color-mix(in srgb, var(--cor-texto) ${Math.round(proximidade * 100)}%, var(--cor-texto-secundario))`;
    partes.cobra.style.opacity = (1 - 0.45 * proximidade * (1 - pulso)).toFixed(3);
  }

  /* --- O teclado de quem joga ------------------------------------------- */

  function aoTeclar(evento) {
    if (capturado) return;
    if (evento.ctrlKey || evento.metaKey || evento.altKey) return;
    if (evento.key === ' ') evento.preventDefault();

    // Voltar da pausa: a tecla só tira da pausa, e não conta.
    if (pausado) {
      pausado = false;
      ultimoQuadro = null;
      ultimaTecla = null;
      partes.aviso.textContent = '';
      return;
    }

    if (evento.repeat) return;
    if (evento.key.length !== 1) return;   // Shift, Enter, setas, acento solto…

    // Caps Lock, como na lição: aviso, som de erro, e a tecla não conta —
    // nem como acerto, nem como erro.
    if (evento.getModifierState && evento.getModifierState('CapsLock')) {
      partes.aviso.textContent = 'Caps Lock ligado. Desligue para continuar.';
      tocarErro();
      return;
    }
    partes.aviso.textContent = '';

    if (!comecou) {
      comecou = true;
      partes.dica.textContent = '';
      partes.leitor.textContent = 'A cobra saiu.';
    }

    if (evento.key === texto[posicao]) acertar();
    else errar();
  }

  function aoSoltar(evento) {
    if (evento.key === 'CapsLock' && !evento.getModifierState('CapsLock')) {
      partes.aviso.textContent = '';
    }
  }

  function acertar() {
    // Quanto mais rápido o acerto, maior o salto.
    const instante = agora();
    const intervalo = ultimaTecla === null ? RITMO : Math.max(0.02, instante - ultimaTecla);
    const fator = Math.min(SALTO_MAXIMO, Math.max(SALTO_MINIMO, Math.sqrt(RITMO / intervalo)));
    ultimaTecla = instante;

    acertos += 1;
    combo += 1;
    comboMaximo = Math.max(comboMaximo, combo);

    let avanco = SALTO * fator;
    const deuFolego = combo % COMBO_A_CADA === 0;
    if (deuFolego) avanco += FOLEGO_DO_COMBO;

    jogador += avanco;

    // Mais longe que a folga máxima, a cobra vem junto.
    cobra = Math.max(cobra, jogador - FOLEGO_MAXIMO * velocidade);

    if (deuFolego) tocarCombo();
    else tocarAcerto();

    // A letra da vez vira certa, e a fita anda.
    const span = letras[posicao];
    span.classList.remove('letra--atual', 'letra--errada');
    span.classList.add('letra--certa');
    erroNaLetraDaVez = false;

    posicao += 1;
    if (posicao > texto.length - 60) acrescentarPalavras(20);
    marcarLetraDaVez();
  }

  function errar() {
    erros += 1;
    combo = 0;
    ultimaTecla = agora();

    jogador -= RECUO;
    tocarErro();

    // A letra da vez fica marcada de erro até sair a tecla certa — como na
    // lição, o cursor não anda no erro.
    const span = letras[posicao];
    span.classList.add('letra--errada');
    erroNaLetraDaVez = true;

    if (cobra >= jogador) capturar();
  }

  /* --- A captura e o fim ------------------------------------------------ */

  function capturar() {
    if (capturado) return;
    capturado = true;
    cobra = jogador;
    jogadorNaTela = jogador;
    fimDaCaptura = relogio + ESPERA_NO_FIM;
    partes.leitor.textContent = 'A cobra te alcançou.';
    tocarCaptura();
  }

  function resumo() {
    // O tempo do fim é o da captura, sem a cena parada depois dela.
    const segundos = capturado ? fimDaCaptura - ESPERA_NO_FIM : relogio;
    const total = acertos + erros;
    return {
      capturado,
      nivel: nivelId,
      distancia: Math.max(0, Math.floor(jogador)),
      ppm: segundos >= 1 ? Math.round((acertos / CARACTERES_POR_PALAVRA) / (segundos / 60)) : 0,
      precisao: total ? Math.round((acertos / total) * 100) : 100,
      comboMaximo,
      segundos,
    };
  }

  function terminar(pelaCobra) {
    const r = resumo();
    r.capturado = pelaCobra;
    encerrarPartida();
    mostrarFim(r);
  }

  /* --- Pausa: sair da janela para a cobra ------------------------------- */

  function aoSair() {
    if (!comecou || capturado || pausado) return;
    pausado = true;
    partes.aviso.textContent = 'Pausado. Aperte qualquer tecla para continuar.';
    partes.leitor.textContent = 'Pausado.';
  }

  function aoMudarVisibilidade() {
    if (document.visibilityState === 'hidden') aoSair();
  }

  const botaoEncerrar = tela.querySelector('[data-acao="encerrar"]');
  botaoEncerrar.addEventListener('mousedown', (e) => e.preventDefault());
  botaoEncerrar.addEventListener('click', () => terminar(false));

  window.addEventListener('keydown', aoTeclar);
  window.addEventListener('keyup', aoSoltar);
  window.addEventListener('blur', aoSair);
  document.addEventListener('visibilitychange', aoMudarVisibilidade);

  partida = {
    quadro: requestAnimationFrame(quadro),
    aoTeclar,
    aoSoltar,
    aoSair,
    aoMudarVisibilidade,
    // Só para inspecionar o rascunho pelo console; o jogo não usa.
    espiar: () => ({
      comecou, pausado, capturado, relogio, jogador, cobra, folego: folego(), multiplicador,
      velocidade, escala, tique, posicao, letraDaVez: texto[posicao], acertos, erros, combo, comboMaximo,
      erroNaLetraDaVez, resumo: resumo(),
    }),
  };
}

/* ==========================================================================
   TELA 3 — o fim
   ========================================================================== */

function mostrarFim(r) {
  tela.replaceChildren();
  tela.insertAdjacentHTML('beforeend', `
    <div class="cobra-fim">
      <h1>${r.capturado ? 'A cobra te alcançou.' : 'Partida encerrada.'}</h1>
      <p class="subtitulo">Cobra · Fuga · ${NIVEIS[r.nivel].nome}</p>

      <div class="cobra-numeros">
        <div>
          <p class="cobra-numero">${r.distancia}<small> m</small></p>
          <p class="ajuda">distância percorrida</p>
        </div>
        <div>
          <p class="cobra-numero">${r.ppm}</p>
          <p class="ajuda">PPM · sua média é ${PPM_MEDIO}</p>
        </div>
        <div>
          <p class="cobra-numero">${r.precisao}%</p>
          <p class="ajuda">precisão</p>
        </div>
        <div>
          <p class="cobra-numero">${r.comboMaximo}</p>
          <p class="ajuda">combo máximo</p>
        </div>
        <div>
          <p class="cobra-numero">${formatarTempo(r.segundos)}</p>
          <p class="ajuda">tempo sobrevivido</p>
        </div>
      </div>

      <div class="cobra-acoes">
        <button type="button" class="botao botao--principal" data-acao="de-novo">Jogar de novo</button>
        <button type="button" class="botao" data-acao="voltar">Trocar o nível</button>
        <a class="cobra-voltar" href="jogos.html">Voltar aos jogos</a>
      </div>
    </div>
  `);

  tela.querySelector('[data-acao="de-novo"]').addEventListener('click', mostrarPartida);
  tela.querySelector('[data-acao="voltar"]').addEventListener('click', mostrarInicio);
}

/* ==========================================================================
   Cabeçalho, aviso do celular e início
   ========================================================================== */

const botaoSom = document.querySelector('#botao-som');

function escreverSom() {
  botaoSom.querySelector('use').setAttribute('href', estadoSalvo.mudo ? '#icone-mudo' : '#icone-som');
  botaoSom.setAttribute('aria-pressed', String(!!estadoSalvo.mudo));
  botaoSom.setAttribute('aria-label', estadoSalvo.mudo ? 'Ligar os sons' : 'Silenciar os sons');
}

// Os botões não podem ficar com o foco: a próxima tecla iria para eles.
botaoSom.addEventListener('mousedown', (e) => e.preventDefault());
botaoSom.addEventListener('click', () => {
  guardar({ mudo: !estadoSalvo.mudo });
  escreverSom();
});

const botaoTema = document.querySelector('#botao-tema');

function escreverTema() {
  const escuro = document.documentElement.dataset.tema === 'escuro';
  botaoTema.querySelector('use').setAttribute('href', escuro ? '#icone-sol' : '#icone-lua');
}

botaoTema.addEventListener('mousedown', (e) => e.preventDefault());
botaoTema.addEventListener('click', () => {
  const escuro = document.documentElement.dataset.tema === 'escuro';
  document.documentElement.dataset.tema = escuro ? 'claro' : 'escuro';
  escreverTema();
});

function pareceSemTecladoFisico() {
  return window.matchMedia('(hover: none)').matches && window.matchMedia('(pointer: coarse)').matches;
}

function mostrarAvisoSemTeclado() {
  tela.replaceChildren();
  tela.insertAdjacentHTML('beforeend', `
    <div class="sem-teclado">
      <h1>O digita. foi feito para computador com teclado.</h1>
      <p class="subtitulo">Ele ensina a digitar com os dez dedos, mostrando qual dedo usar em cada tecla. Num celular ou tablet sem teclado, não há o que treinar.</p>
      <p class="ajuda">Abra este endereço no seu computador para começar.</p>
      <button type="button" class="botao" data-acao="continuar">Tenho um teclado conectado — quero entrar assim mesmo</button>
    </div>
  `);
  tela.querySelector('[data-acao="continuar"]').addEventListener('click', mostrarInicio);
}

escreverSom();
escreverTema();

if (pareceSemTecladoFisico()) mostrarAvisoSemTeclado();
else mostrarInicio();
</script>
