<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rascunho — Treino livre</title>

<style>
/* ==========================================================================
   RASCUNHO da tela "Treino livre".

   Arquivo único e autocontido, para aprovar o visual e a interação antes de
   mexer no site. Nada daqui está ligado ao digita. de verdade.

   O que foi COPIADO do site, sem alterar nada:
     - as variáveis do css/tema.css (paleta clara e escura, tipografia,
       espaçamentos, medidas);
     - o desenho do teclado (css/teclado.css) e o layout ABNT2;
     - a geometria da tela de lição (css/telas.css): texto, palco, mãos;
     - o caminho SVG das mãos e as coordenadas das bolinhas (js/maos.js).
   ========================================================================== */

/* ==========================================================================
   tema.css — copiado do site, tal e qual.
   ========================================================================== */

:root {
  color-scheme: light;

  --cor-fundo: #FFFFFF;
  --cor-superficie: #F4F4F5;
  --cor-borda: #E4E4E7;
  --cor-texto: #18181B;
  --cor-texto-secundario: #52525B;
  --cor-texto-discreto: #71717A;
  --cor-letra-pendente: #8E8E96;
  --cor-licao-feita: #444444;

  --cor-botao-fundo: #18181B;
  --cor-botao-texto: #FFFFFF;
  --cor-botao-secundario-borda: #D4D4D8;

  --dedo-minimo-fundo: #EDE9FE;
  --dedo-minimo-texto: #5B21B6;

  --dedo-anelar-fundo: #DBEAFE;
  --dedo-anelar-texto: #1E40AF;

  --dedo-medio-fundo: #CCFBF1;
  --dedo-medio-texto: #115E59;

  --dedo-indicador-fundo: #DCFCE7;
  --dedo-indicador-texto: #166534;

  --dedo-neutro-fundo: #F4F4F5;
  --dedo-neutro-texto: #52525B;

  --cor-erro-fundo: #FEE2E2;
  --cor-erro-texto: #B91C1C;

  --fonte-titulo: system-ui, -apple-system, "Segoe UI", sans-serif;
  --fonte-texto: system-ui, -apple-system, "Segoe UI", sans-serif;
  --fonte-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --peso-titulo: 600;
  --espacamento-titulo: -0.02em;

  --esp-1: 0.25rem;
  --esp-2: 0.5rem;
  --esp-3: 0.75rem;
  --esp-4: 1rem;
  --esp-5: 1.5rem;
  --esp-6: 2rem;
  --esp-7: 3rem;
  --esp-8: 4rem;

  --raio-p: 6px;
  --raio-m: 10px;
  --raio-g: 16px;
  --borda: 1px solid var(--cor-borda);
  --largura-max: 1100px;
  --largura-teclado-max: 960px;

  --tamanho-texto-licao: clamp(1.6rem, 4cqw, 2.4rem);
  --largura-maos: 107px;

  --transicao: 150ms ease;

  /* Só para a troca das ilustrações: um fade de 150ms fica nervoso demais
     quando o desenho inteiro troca. O --transicao continua valendo para
     todo o resto. */
  --transicao-lenta: 250ms ease;
}

/* Modo escuro — copiado do site, sem alterar uma cor sequer. */
:root[data-tema="escuro"] {
  color-scheme: dark;

  --cor-fundo: #1F1F1D;
  --cor-superficie: #2C2C2A;
  --cor-borda: #444441;
  --cor-texto: #F1EFE8;
  --cor-texto-secundario: #B4B2A9;
  --cor-texto-discreto: #888780;
  --cor-letra-pendente: #888780;
  --cor-licao-feita: #B4B2A9;

  --cor-botao-fundo: #F1EFE8;
  --cor-botao-texto: #2C2C2A;
  --cor-botao-secundario-borda: #444441;

  --dedo-minimo-fundo: #3C3489;
  --dedo-minimo-texto: #CECBF6;

  --dedo-anelar-fundo: #0C447C;
  --dedo-anelar-texto: #B5D4F4;

  --dedo-medio-fundo: #085041;
  --dedo-medio-texto: #9FE1CB;

  --dedo-indicador-fundo: #27500A;
  --dedo-indicador-texto: #C0DD97;

  --dedo-neutro-fundo: #444441;
  --dedo-neutro-texto: #D3D1C7;

  --cor-erro-fundo: #791F1F;
  --cor-erro-texto: #F7C1C1;
}

/* ==========================================================================
   Base
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--cor-fundo);
  color: var(--cor-texto);
  font-family: var(--fonte-texto);
  line-height: 1.5;
}

h1, h2, h3 {
  font-family: var(--fonte-titulo);
  font-weight: var(--peso-titulo);
  line-height: 1.2;
  letter-spacing: var(--espacamento-titulo);
  margin: 0;
}

h1 { font-size: clamp(1.9rem, 1.4rem + 2vw, 2.6rem); }
h2 { font-size: clamp(1.3rem, 1.15rem + 0.8vw, 1.7rem); }

p { margin: 0; }

.pagina {
  max-width: var(--largura-max);
  margin: 0 auto;
  padding: var(--esp-5) var(--esp-5) var(--esp-8);
}

.ajuda {
  color: var(--cor-texto-discreto);
  font-size: 0.9rem;
}

.apenas-leitor-de-tela {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}

/* --- Botões (copiados do componentes.css) ------------------------------- */

.botao {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--esp-2);

  padding: var(--esp-3) var(--esp-5);
  border: 1px solid var(--cor-botao-secundario-borda);
  border-radius: var(--raio-p);
  background-color: transparent;
  color: var(--cor-texto);

  font-family: inherit;
  font-size: 0.95rem;
  line-height: 1;
  cursor: pointer;
  transition: background-color var(--transicao), border-color var(--transicao);
}

.botao:hover { border-color: var(--cor-texto-secundario); }

.botao--principal {
  border-color: var(--cor-botao-fundo);
  background-color: var(--cor-botao-fundo);
  color: var(--cor-botao-texto);
}

.botao--principal:hover { opacity: 0.88; }
.botao:disabled { opacity: 0.5; cursor: not-allowed; }

.botao-icone {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.25rem;
  height: 2.25rem;
  border: 1px solid var(--cor-botao-secundario-borda);
  border-radius: var(--raio-p);
  background: none;
  color: var(--cor-texto);
  cursor: pointer;
}

.botao-icone svg { width: 1.1rem; height: 1.1rem; }

/* ==========================================================================
   A barra do rascunho — NÃO faz parte do desenho.
   No site, tema, som e sistema vêm do cabeçalho e do digita:config.
   ========================================================================== */

.rascunho-barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--esp-4);
  max-width: var(--largura-max);
  margin: 0 auto;
  padding: var(--esp-3) var(--esp-5);
  border-bottom: var(--borda);
}

.rascunho-aviso { color: var(--cor-texto-discreto); font-size: 0.8rem; }
.rascunho-controles { display: flex; align-items: center; gap: var(--esp-2); }

.rascunho-botao {
  padding: var(--esp-2) var(--esp-3);
  border: 1px solid var(--cor-botao-secundario-borda);
  border-radius: var(--raio-p);
  background: none;
  color: var(--cor-texto);
  font: inherit;
  font-size: 0.8rem;
  cursor: pointer;
}

/* ==========================================================================
   ESTADO 1 — seleção. Duas colunas, como a tela de entrada.
   ========================================================================== */

/* O título e o subtítulo ficam ACIMA das duas colunas, e não dentro da
   esquerda. É o que faz "O QUE TREINAR" e "TECLAS QUE MAIS ESCAPAM"
   começarem na mesma linha: os dois são rótulos de seção, e alinhá-los dá à
   página uma linha horizontal em que o olho se apoia. Com o título dentro da
   coluna, o rótulo da direita ficava solto lá em cima, ao lado de um título
   grande, sem nada a que se prender. */
.entrada {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--esp-8);
  align-items: start;
  padding-bottom: var(--esp-6);
}

.entrada-titulo { padding-top: var(--esp-6); }

@media (max-width: 60rem) {
  .entrada { grid-template-columns: 1fr; gap: var(--esp-6); }

  /* Numa coluna só, a ilustração esticaria até a largura da tela. O limite
     de 340px é o mesmo de cima, repetido aqui como garantia. */
  .ilustracoes { max-width: 340px; }
}

.subtitulo {
  color: var(--cor-texto-secundario);
  margin-bottom: var(--esp-6);
}

.grupo { margin-bottom: var(--esp-6); }

.grupo-rotulo {
  margin-bottom: var(--esp-3);
  color: var(--cor-texto-discreto);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* --- Os modos: linhas finas, sem caixa ---------------------------------- */

.modos { border-top: var(--borda); }

.modo {
  display: grid;
  grid-template-columns: 1rem 1fr;
  align-items: start;
  gap: var(--esp-4);

  width: 100%;
  padding: var(--esp-4) 0;
  border: 0;
  border-bottom: var(--borda);
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

/* A marca do modo escolhido: um ponto, do tamanho do da lição de agora na
   trilha. Sem caixa, sem fundo, sem borda colorida. */
.modo-marca {
  display: flex;
  justify-content: center;
  margin-top: 0.45rem;
}

.modo-ponto {
  transition: border-color var(--transicao), background-color var(--transicao);
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid var(--cor-texto-discreto);
}

.modo[aria-pressed='true'] .modo-ponto {
  border-color: var(--cor-texto);
  background-color: var(--cor-texto);
}

.modo-nome {
  display: block;
  font-weight: 600;
  transition: color var(--transicao);
}

.modo[aria-pressed='true'] .modo-nome { color: var(--cor-texto); }
.modo:not([aria-pressed='true']) .modo-nome { color: var(--cor-texto-secundario); }

/* --- O gesto ao passar o mouse -----------------------------------------

   O mesmo das lições na tela de trilha: o texto escurece e desliza 4px para
   a direita. Nome e descrição deslizam JUNTOS — mover só o nome deixaria a
   descrição para trás.

   Este bloco precisa vir DEPOIS das duas regras acima: elas têm a mesma
   especificidade que o :hover, e nesse empate quem vence é a última escrita.
   Antes, a regra do "não escolhido" anulava o escurecimento.
   ---------------------------------------------------------------------- */

.modo-texto {
  /* A transição fica aqui, e não no :hover, para o texto voltar deslizando
     quando o mouse sai — em vez de dar um pulo. */
  transition: transform var(--transicao);
}

.modo:hover .modo-texto {
  transform: translateX(4px);
}

.modo:hover .modo-nome {
  color: var(--cor-texto);
}

/* A bolinha escurece junto, para o modo inteiro responder ao mouse. */
.modo:hover .modo-ponto {
  border-color: var(--cor-texto);
}

.modo-descricao {
  display: block;
  margin-top: 2px;
  color: var(--cor-texto-discreto);
  font-size: 0.85rem;
}

/* --- Duração: opções em texto, na mesma linha --------------------------- */

.duracoes { display: flex; flex-wrap: wrap; gap: var(--esp-5); }

.duracao {
  padding: 0;
  border: 0;
  background: none;
  color: var(--cor-texto-secundario);
  font: inherit;
  font-size: 0.95rem;
  cursor: pointer;
}

.duracao[aria-pressed='true'] {
  color: var(--cor-texto);
  font-weight: 600;
  box-shadow: inset 0 -2px 0 var(--cor-texto);
}

/* --- Texto próprio ------------------------------------------------------ */

.texto-proprio {
  width: 100%;
  min-height: 8rem;
  margin-top: var(--esp-3);
  padding: var(--esp-3);

  border: var(--borda);
  border-radius: var(--raio-p);
  background-color: transparent;
  color: var(--cor-texto);

  font-family: var(--fonte-mono);
  font-size: 0.9rem;
  line-height: 1.6;
  resize: vertical;
}

/* --- Avisos discretos: só texto, sem caixa ------------------------------ */

.recado {
  margin-top: var(--esp-3);
  color: var(--cor-texto-discreto);
  font-size: 0.85rem;
}

/* --- A coluna da direita: o que o adaptativo vê ------------------------- */

.painel-titulo {
  margin-bottom: var(--esp-4);
  color: var(--cor-texto-discreto);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Quatro por linha, no máximo. Em flex, as teclas se enfileiravam até
   caber — davam oito numa linha e meia quebrada, que é justamente o
   amontoado que se quer evitar. A grade de quatro colunas fecha a conta: as
   oito teclas viram duas fileiras iguais, e as colunas se alinham entre si.
   max-content deixa cada coluna com a largura do seu conteúdo, sem esticar a
   grade até o fim da coluna da página. */
.teclas-fracas {
  display: grid;
  grid-template-columns: repeat(4, max-content);
  gap: var(--esp-2);
  justify-content: start;
}

/* Cada tecla na cor do dedo que a aperta — o mesmo código de cores do
   teclado e das mãos. */
.tecla-fraca {
  display: inline-flex;
  align-items: baseline;
  gap: var(--esp-2);
  padding: var(--esp-1) var(--esp-3);
  border-radius: var(--raio-p);
  font-family: var(--fonte-mono);
  font-size: 0.85rem;
  background-color: var(--dedo-neutro-fundo);
  color: var(--dedo-neutro-texto);
}

.tecla-fraca--minimo    { background-color: var(--dedo-minimo-fundo);    color: var(--dedo-minimo-texto); }
.tecla-fraca--anelar    { background-color: var(--dedo-anelar-fundo);    color: var(--dedo-anelar-texto); }
.tecla-fraca--medio     { background-color: var(--dedo-medio-fundo);     color: var(--dedo-medio-texto); }
.tecla-fraca--indicador { background-color: var(--dedo-indicador-fundo); color: var(--dedo-indicador-texto); }

.tecla-fraca-conta { font-size: 0.75rem; opacity: 0.75; }

/* --- As ilustrações dos modos -------------------------------------------

   As quatro ficam EMPILHADAS no mesmo lugar, uma por cima da outra, e a
   troca é só de opacidade. Por isso o contêiner tira a altura da proporção,
   e não do conteúdo: com todas absolutas, ele não teria altura nenhuma — e
   a coluna pularia de tamanho a cada troca.

   A proporção 4/3 é a do viewBox que as quatro compartilham (320 × 240), o
   que faz o desenho preencher a caixa sem esticar.
   ------------------------------------------------------------------------ */

.ilustracoes {
  position: relative;
  aspect-ratio: 4 / 3;
  max-width: 340px;
  margin-top: var(--esp-6);
  margin-left: -28px;
}

.ilustracao {
  position: absolute;
  inset: 0;

  display: block;
  width: 100%;
  height: auto;
  max-width: 340px;

  /* currentColor: é isto que faz o desenho acompanhar o tema sozinho, e é
     por isto que os SVGs entram inline em vez de <img src>. */
  color: var(--cor-texto-secundario);

  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transicao-lenta);
}

.ilustracao--ativa {
  opacity: 1;
  pointer-events: auto;
}

/* ==========================================================================
   ESTADO 2 — sessão. Copiado da tela de lição.
   ========================================================================== */

.licao {
  display: flex;
  flex-direction: column;
  gap: var(--esp-3);
  max-width: var(--largura-teclado-max);
  margin-inline: auto;
  padding-block: var(--esp-5);

  container-type: inline-size;

  /* A conta da tela de lição, copiada: T = (largura − 56) ÷ 18,77. */
  --tecla-da-licao: clamp(1.2rem, (100cqw - 56px) / 18.77, 3.2rem);
}

/* A linha do topo: tempo, PPM e precisão. Só texto, sem caixa e sem barra. */
.sessao-topo {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--esp-4);
}

.medidas {
  display: flex;
  flex-wrap: wrap;
  gap: var(--esp-5);
  color: var(--cor-texto-discreto);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.medida strong {
  margin-right: var(--esp-1);
  color: var(--cor-texto);
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}

/* "Encerrar": um link discreto, não um botão. */
.encerrar {
  padding: 0;
  border: 0;
  background: none;
  color: var(--cor-texto-discreto);
  font: inherit;
  font-size: 0.85rem;
  text-decoration: underline;
  text-underline-offset: 0.2em;
  cursor: pointer;
}

.encerrar:hover { color: var(--cor-texto); }

.aviso-caps {
  align-self: center;
  padding: var(--esp-2) var(--esp-4);
  border-radius: var(--raio-p);
  background-color: var(--cor-erro-fundo);
  color: var(--cor-erro-texto);
  font-size: 0.9rem;
  font-weight: 600;
}

.licao-corpo { display: flex; flex-direction: column; align-items: center; }

.licao-texto {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  min-width: 0;
}

.licao-texto > [data-papel='texto'] {
  width: fit-content;

  /* A caixa do texto nunca passa da largura do TECLADO. A conta é a mesma
     que a tela de lição já usa para dimensionar o palco: a fileira tem 15
     teclas de largura e 14 vãos de 4px entre elas. Sem este limite, as
     linhas mais longas vazam para os lados e o texto deixa de ficar no
     mesmo eixo do teclado. */
  max-width: min(100%, calc(15 * var(--tecla-da-licao) + 56px));

  min-height: calc(3 * 1.7 * var(--tamanho-texto-licao));
}

.licao-espera {
  align-self: center;
  margin-top: var(--esp-2);
  color: var(--cor-texto-secundario);
  font-size: 0.9rem;
}

.area-digitacao { position: relative; cursor: text; }

.campo-invisivel {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  padding: 0; border: 0;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  outline: none;
  font-size: 1rem;
}

.linha-digitacao {
  max-width: none;
  margin: 0;
  font-family: var(--fonte-mono);
  font-size: var(--tamanho-texto-licao);
  line-height: 1.7;
  letter-spacing: 0.02em;
  text-align: left;
  white-space: pre-wrap;
}

.letra--certa { color: var(--cor-texto); }

.letra--atual {
  color: var(--cor-letra-pendente);
  box-shadow: inset 0 -3px 0 var(--cor-texto);
}

.letra--falta { color: var(--cor-letra-pendente); }

.letra--errada {
  background-color: var(--cor-erro-fundo);
  color: var(--cor-erro-texto);
  border-radius: var(--raio-p);
}

.letra--espaco.letra--atual { background-color: var(--cor-superficie); border-radius: var(--raio-p); }
.letra--espaco.letra--errada { background-color: var(--cor-erro-fundo); }

/* --- O palco: mão, teclado, mão ----------------------------------------- */

.licao-palco {
  position: relative;
  display: flex;
  justify-content: center;
  width: 100%;
  padding-inline: calc(1.887 * var(--tecla-da-licao));
}

.licao-palco .teclado { --tecla: var(--tecla-da-licao); }

.maos { display: contents; }

.mao {
  position: absolute;
  top: 0;
  height: calc(1.6 * var(--tecla-da-licao));
  width: auto;
  flex: 0 0 auto;
  overflow: visible;
}

.mao--esquerda { left: 0; order: -1; }
.mao--direita { right: 0; order: 1; }

.mao-contorno { fill: none; stroke: var(--cor-texto-secundario); }

.mao-bolinha { fill: none; transition: fill var(--transicao); }

.mao-bolinha--minimo    { fill: var(--dedo-minimo-texto); }
.mao-bolinha--anelar    { fill: var(--dedo-anelar-texto); }
.mao-bolinha--medio     { fill: var(--dedo-medio-texto); }
.mao-bolinha--indicador { fill: var(--dedo-indicador-texto); }
.mao-bolinha--polegar   { fill: var(--dedo-neutro-texto); }

.mao-bolinha--pulsando { animation: pulsar-bolinha 1s ease-in-out infinite; }

@keyframes pulsar-bolinha {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

@media (max-width: 64rem) {
  .maos { display: none; }
  .licao-palco { padding-inline: 0; }
  .licao { --tecla-da-licao: clamp(1.2rem, 5.7cqw, 3.2rem); }
}

/* --- O teclado (copiado do css/teclado.css) ----------------------------- */

.teclado {
  --tecla: clamp(1.5rem, 3.6vw, 2.6rem);
  --tecla-vao: 0.25rem;

  destino.replaceChildren();
  destino.className = 'teclado';
  destino.setAttribute('aria-hidden', 'true');

  for (const teclas of [...LAYOUTS[layout], ULTIMA_FILEIRA[sistema]]) {
    const fileira = document.createElement('div');
    fileira.className = 'teclado-fileira';

    for (const tecla of teclas) {
      const elemento = document.createElement('div');
      elemento.className = 'tecla tecla--neutro';
      elemento.dataset.codigo = tecla.codigo;
      elemento.style.setProperty('--largura', tecla.largura ?? 1);

      if (TECLAS_DE_REFERENCIA.includes(tecla.codigo)) elemento.classList.add('tecla--referencia');
      if (tecla.alta) elemento.classList.add('tecla--alta');
      if (tecla.especial) elemento.classList.add('tecla--comando');

      if (tecla.sup) {
        const sup = document.createElement('span');
        sup.className = 'tecla-sup';
        sup.textContent = tecla.sup;
        elemento.append(sup);
      }

      const rotulo = document.createElement('span');
      rotulo.className = 'tecla-rotulo';
      rotulo.textContent = tecla.especial
        ? (ROTULOS_ESPECIAIS[sistema][tecla.especial] ?? tecla.especial)
        : tecla.rotulo;
      elemento.append(rotulo);

      fileira.append(elemento);
    }

    destino.append(fileira);

/* Letra → tecla, montado a partir do próprio layout. Um mapa por layout. */
const mapasDeLetras = new Map();

function letraParaTecla(letra, layout = layoutAtual()) {
  let mapaDeLetras = mapasDeLetras.get(layout);

  if (!mapaDeLetras) {
    mapaDeLetras = new Map();
    mapasDeLetras.set(layout, mapaDeLetras);

    for (const fileira of LAYOUTS[layout]) {
      for (const tecla of fileira) {
        if (tecla.rotulo) mapaDeLetras.set(tecla.rotulo.toLowerCase(), { codigo: tecla.codigo, modificador: null });
        if (tecla.sup) mapaDeLetras.set(tecla.sup.toLowerCase(), { codigo: tecla.codigo, modificador: 'shift' });
      }
    }

    for (const [chave, onde] of [...mapaDeLetras]) {
      const maiuscula = chave.toUpperCase();
      if (maiuscula !== chave) mapaDeLetras.set(maiuscula, { ...onde, modificador: 'shift' });
    }

    mapaDeLetras.set(' ', { codigo: 'Space', modificador: null });
  }

  return mapaDeLetras.get(letra) ?? null;

   O brasileiro não precisa desta tabela: lá os acentos são teclas com
   rótulo, e saem do próprio desenho do layout. */

  mac: {
    '´': { codigo: 'KeyE', modificador: 'option' },
    '`': { codigo: 'Backquote', modificador: 'option' },
    '^': { codigo: 'KeyI', modificador: 'option' },
    '~': { codigo: 'KeyN', modificador: 'option' },
    '¨': { codigo: 'KeyU', modificador: 'option' },
  },
  windows: {
    '´': { codigo: 'Quote', modificador: null },
    '`': { codigo: 'Backquote', modificador: null },
    '^': { codigo: 'Digit6', modificador: 'shift' },
    '~': { codigo: 'Backquote', modificador: 'shift' },
    '¨': { codigo: 'Quote', modificador: 'shift' },
  },
};

/** Os passos para produzir uma letra: uma tecla, ou o acento e depois ela. */
function passosDaLetra(letra) {
  const layout = layoutAtual();
  const sistema = sistemaAtual();

  const direta = letraParaTecla(letra, layout);
  if (direta) return [{ ...direta, letra }];

  const partes = letra.normalize('NFD');
  if (partes.length < 2) return [];

  // O ç no americano do Mac é a exceção: ⌥ + c entrega a letra pronta, de
  // uma vez, e não são dois passos.
  if (partes[1] === '\u0327' && layout === 'us' && sistema === 'mac') {
    return [{ codigo: 'KeyC', modificador: 'option', letra: 'ç' }];
  }

  const acento = SINAL_DO_ACENTO[partes[1]];
  if (!acento) return [];

  const teclaAcento = layout === 'abnt2'
    ? letraParaTecla(acento, 'abnt2')
    : (ACENTO_NO_US[sistema === 'mac' ? 'mac' : 'windows'][acento] ?? null);

  const teclaLetra = letraParaTecla(partes[0], layout);
  if (!teclaAcento || !teclaLetra) return [];

  return [{ ...teclaAcento, letra: acento }, { ...teclaLetra, letra: partes[0] }];
}

/** A modificadora é segurada pela mão CONTRÁRIA à da letra. */
function teclaDaModificadora(modificador, maoDaLetra) {
  const oposta = maoDaLetra === 'esquerda' ? 'direita' : 'esquerda';
  const ladoDireito = oposta === 'direita';

  if (modificador === 'shift') {
    return { nome: 'Shift', codigo: ladoDireito ? 'ShiftRight' : 'ShiftLeft', mao: oposta, dedo: 'minimo' };
  }

  if (modificador === 'option') {
    return { nome: 'Option', codigo: ladoDireito ? 'AltRight' : 'AltLeft', mao: oposta, dedo: 'polegar' };
  }

  return null;
}

function destacarTecla(teclado, codigo) {
  limparDestaque(teclado);

  const tecla = teclado.querySelector(`[data-codigo="${codigo}"]`);
  if (!tecla) return;

  const posicao = dedoDaTecla(codigo);
  tecla.classList.add('tecla--ativa');
  if (posicao) tecla.classList.add(`tecla--${posicao.dedo}`);
}

function limparDestaque(teclado) {
  teclado.querySelectorAll('.tecla--modificadora').forEach((t) => t.classList.remove('tecla--modificadora'));

  teclado.querySelectorAll('.tecla--ativa').forEach((tecla) => {
    tecla.classList.remove('tecla--ativa');
    const posicao = dedoDaTecla(tecla.dataset.codigo);
    if (posicao) tecla.classList.remove(`tecla--${posicao.dedo}`);
  });
}

function piscarErro(teclado, codigo) {
  const tecla = teclado.querySelector(`[data-codigo="${codigo}"]`);

}

/* --------------------------------------------------------------------------
   Som — só o de erro, que é o que a sessão usa. Copiado do js/som.js.
   Nada toca antes da primeira interação: o contexto só nasce no primeiro som.
   -------------------------------------------------------------------------- */

let contextoDeAudio = null;
let mudo = false;

function tocarErro() {
  if (mudo) return;

  const Contexto = window.AudioContext || window.webkitAudioContext;
  if (!Contexto) return;

  contextoDeAudio = contextoDeAudio ?? new Contexto();
  if (contextoDeAudio.state === 'suspended') contextoDeAudio.resume();

  const agora = contextoDeAudio.currentTime;
  const oscilador = contextoDeAudio.createOscillator();
  const envelope = contextoDeAudio.createGain();

  oscilador.type = 'sine';
  oscilador.frequency.value = 180;

  envelope.gain.setValueAtTime(0.0001, agora);
  envelope.gain.exponentialRampToValueAtTime(0.09, agora + 0.008);
  envelope.gain.exponentialRampToValueAtTime(0.0001, agora + 0.12);

  oscilador.connect(envelope).connect(contextoDeAudio.destination);
  oscilador.start(agora);
  oscilador.stop(agora + 0.13);
}

/* Palavras com acento e Ç. */
const PALAVRAS_ACENTUADAS = [

  'à', 'às', 'àquela', 'saída', 'país', 'raízes', 'aí',
];

/* Números e operadores do teclado numérico. */
const NUMEROS = [
  '12', '45', '78', '90', '123', '456', '789', '100', '250', '1000',
  '3.14', '2.50', '0.75', '99', '365', '1024', '42',
];
const OPERADORES = ['+', '-', '*', '/', '='];

/* --------------------------------------------------------------------------
   O modo Adaptativo

   A regra, em uma frase: cada tecla ganha um PESO, e as palavras que a usam
   passam a ser sorteadas mais vezes.
   O peso soma as duas fraquezas que as estatísticas conhecem — errar muito e
   demorar muito —, porque uma tecla lenta atrasa tanto quanto uma errada.
   -------------------------------------------------------------------------- */

function lerEstatisticas() {
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVES.estatisticas) || 'null');
    if (salvo?.errosPorTecla) return salvo;
  } catch (erro) {
    /* sem localStorage: usa o exemplo */
  }

  return ESTATISTICAS_DE_EXEMPLO;
}

function pesosPorTecla() {
  const { errosPorTecla = {}, msPorTecla = {} } = lerEstatisticas();
  const pesos = {};

  const piorTempo = Math.max(1, ...Object.values(msPorTecla));

  for (const tecla of new Set([...Object.keys(errosPorTecla), ...Object.keys(msPorTecla)])) {
    // Erro vale mais que lentidão: errar é não saber onde a tecla fica;
    // demorar é saber, mas ainda procurar.
    const porErro = (errosPorTecla[tecla] ?? 0) * 2;
    const porLentidao = ((msPorTecla[tecla] ?? 0) / piorTempo) * 10;

    pesos[tecla] = porErro + porLentidao;
  }

  return pesos;
}

/** As teclas mais fracas, da pior para a menos pior. */
function teclasMaisFracas(quantas = 6) {
  const pesos = pesosPorTecla();

  return Object.entries(pesos)
    .sort((a, b) => b[1] - a[1])
    .slice(0, quantas)
    .map(([tecla]) => tecla);
}

/** Uma palavra sorteada com peso: quanto mais tecla fraca, mais chance. */
function sortearAdaptativa(pesos) {
  const candidatas = PALAVRAS.map((palavra) => {
    let peso = 1; // toda palavra tem alguma chance, senão o treino vira monólogo
    for (const letra of palavra) peso += pesos[letra] ?? 0;
    return { palavra, peso };
  });

  const total = candidatas.reduce((soma, c) => soma + c.peso, 0);
  let sorte = Math.random() * total;

  for (const candidata of candidatas) {
    sorte -= candidata.peso;
    if (sorte <= 0) return candidata.palavra;
  }

  return candidatas[candidatas.length - 1].palavra;
}

/* --------------------------------------------------------------------------
   Geração de texto — sempre há mais linha quando a anterior acaba.
   -------------------------------------------------------------------------- */

/* Quantos caracteres cabem numa linha.
   O número não é solto: a caixa do texto tem a largura do teclado, e nessa
   largura cabem cerca de 32 caracteres da fonte monoespaçada da lição — em
   qualquer tamanho de tela, porque texto e teclado encolhem juntos. Trinta
   deixa a folga que impede uma palavra comprida de empurrar a linha para
   uma segunda fileira e bagunçar a janela de três linhas. */
const LARGURA_DA_LINHA = 30;

function sortear(lista) {
  return lista[Math.floor(Math.random() * lista.length)];
}

function proximaPalavra(modo) {
  if (modo === 'adaptativo') return sortearAdaptativa(pesosPorTecla());
  if (modo === 'acentos') return sortear(PALAVRAS_ACENTUADAS);

  if (modo === 'numerico') {
    // Uma conta a cada três pedaços, para o operador aparecer sem virar o
    // exercício inteiro.
    return Math.random() < 0.33
      ? `${sortear(NUMEROS)} ${sortear(OPERADORES)} ${sortear(NUMEROS)}`
      : sortear(NUMEROS);
  }

  return sortear(PALAVRAS);
}

/**
 * Gera linhas novas.
 * No "Texto próprio" o conteúdo é fixo: quando ele acaba, recomeça — é o
 * mesmo texto, treinado de novo, e não um texto inventado por cima do dele.
 */
function gerarLinhas(modo, textoProprio, quantas) {
  if (modo === 'proprio') return quebrarEmLinhas(textoProprio, quantas);

  const linhas = [];

  for (let i = 0; i < quantas; i += 1) {
    let linha = '';

    // Para na palavra que NÃO cabe, e não depois dela: somar primeiro e
    // conferir depois era o que fazia a linha passar do limite.
    for (;;) {
      const palavra = proximaPalavra(modo);
      const candidata = linha ? `${linha} ${palavra}` : palavra;

      if (linha && candidata.length > LARGURA_DA_LINHA) break;
      linha = candidata;
    }

    linhas.push(linha);
  }

  return linhas;
}

function quebrarEmLinhas(texto, quantas) {
  const palavras = texto.trim().split(/\s+/).filter(Boolean);
  if (!palavras.length) return ['texto vazio'];

  const linhas = [];
  let linha = '';

  for (const palavra of palavras) {
    if (linha && (linha + ' ' + palavra).length > LARGURA_DA_LINHA) {
      linhas.push(linha);
      linha = palavra;
    } else {
      linha = linha ? `${linha} ${palavra}` : palavra;
    }
  }

  if (linha) linhas.push(linha);

  // Repete até ter linhas suficientes.
  const saida = [];
  while (saida.length < quantas) saida.push(...linhas);

  return saida.slice(0, quantas);
}

/* ==========================================================================
   O MOTOR DE DIGITAÇÃO

   Adaptado do js/motor-digitacao.js. A diferença é uma só: aqui o texto
   CRESCE. Quando o cursor chega perto do fim, entram mais linhas, e a
   sessão não para — quem manda no fim é o relógio, não o texto.
   ========================================================================== */

function criarMotor({ modo, textoProprio, aoAtualizar, aoErrar, aoMudarFoco }) {
  let texto = gerarLinhas(modo, textoProprio, 12).join('\n');
  let posicao = 0;
  let errouAqui = false;
  let compondo = '';

  let campo = null;
  let destino = null;

  // Métricas
  let comecouEm = null;
  let acertos = 0;
  let errosTotais = 0;
  const errosPorTecla = {};

  function estado() {
    return { texto, posicao, errouAqui, compondo, letraEsperada: texto[posicao] ?? null };
  }

  function medidas() {
    const segundos = comecouEm ? Math.max(1, (Date.now() - comecouEm) / 1000) : 1;
    const tentativas = acertos + errosTotais;

    return {
      ppm: Math.round(acertos / 5 / (segundos / 60)),
      precisao: tentativas ? Math.round((acertos / tentativas) * 100) : 100,
      segundos: comecouEm ? (Date.now() - comecouEm) / 1000 : 0,
      acertos,
      errosPorTecla,
    };
  }

  function avisar() {
    aoAtualizar?.(estado(), medidas());
  }

  /** Sempre com folga de linhas à frente: o texto nunca acaba na cara. */
  function alimentar() {
    const faltando = texto.length - posicao;
    if (faltando > LARGURA_DA_LINHA * 4) return;

    texto += '\n' + gerarLinhas(modo, textoProprio, 8).join('\n');
  }

  function conferirLetra(letra) {
    const esperada = texto[posicao];
    if (esperada === undefined) return;

    comecouEm = comecouEm ?? Date.now();

    if (letra === esperada) {
      acertos += 1;
      posicao += 1;
      errouAqui = false;

      while (texto[posicao] === '\n') posicao += 1;
      alimentar();
      return;
    }

    // Errou: o cursor NÃO anda. A pessoa continua na mesma letra até acertar.
    errosTotais += 1;
    errosPorTecla[esperada] = (errosPorTecla[esperada] ?? 0) + 1;
    errouAqui = true;

    aoErrar?.({ esperada, digitada: letra });
  }

  function processar(digitado) {
    if (!digitado) return;
    for (const letra of digitado) conferirLetra(letra);
    avisar();
  }

  function montar(elemento) {
    destino = elemento;
    destino.classList.add('area-digitacao');

    campo = document.createElement('input');
    campo.type = 'text';
    campo.className = 'campo-invisivel';
    campo.autocomplete = 'off';
    campo.autocapitalize = 'off';
    campo.spellcheck = false;
    campo.setAttribute('autocorrect', 'off');
    campo.setAttribute('aria-label', 'Área de digitação do treino livre');

    campo.addEventListener('input', (evento) => {
      if (!campo) return;
      if (evento.isComposing || compondo) return;
      processar(campo.value);
      campo.value = '';
    });

    campo.addEventListener('compositionstart', () => { compondo = ' '; avisar(); });
    campo.addEventListener('compositionupdate', (e) => { compondo = e.data ?? ''; avisar(); });
    campo.addEventListener('compositionend', (evento) => {
      if (!campo) return;
      compondo = '';
      processar(evento.data ?? '');
      campo.value = '';
    });

    campo.addEventListener('keydown', (evento) => {
      if (evento.key === 'Tab' || evento.key === 'Backspace') evento.preventDefault();
    });

    campo.addEventListener('paste', (evento) => evento.preventDefault());
    campo.addEventListener('focus', () => aoMudarFoco?.(true));
    campo.addEventListener('blur', () => aoMudarFoco?.(false));

    destino.addEventListener('pointerdown', (evento) => {
      if (evento.target !== campo) {
        evento.preventDefault();
        focar();
      }
    });

    destino.append(campo);
    focar();
    avisar();
  }

  function focar() { campo?.focus({ preventScroll: true }); }

  function destruir() {
    campo?.remove();
    campo = null;
    destino?.classList.remove('area-digitacao');
  }

  return { montar, focar, destruir, estado, medidas };
}

/* --------------------------------------------------------------------------
   Desenho do texto — copiado do motor-digitacao.js (janela de 3 linhas).
   -------------------------------------------------------------------------- */

function desenharTexto(destino, estado, linhasVisiveis = 3) {
  const { texto, posicao, errouAqui } = estado;

  destino.querySelectorAll('.linha-digitacao').forEach((linha) => linha.remove());

  const linhas = [];
  let inicio = 0;

  for (const conteudo of texto.split('\n')) {
    linhas.push({ conteudo, inicio });
    inicio += conteudo.length + 1;
  }

  const atual = Math.max(0, linhas.findLastIndex((linha) => linha.inicio <= posicao));
  const primeira = Math.min(Math.max(0, atual - 1), Math.max(0, linhas.length - linhasVisiveis));

  const novas = document.createDocumentFragment();

  for (const linha of linhas.slice(primeira, primeira + linhasVisiveis)) {
    const elementoLinha = document.createElement('p');
    elementoLinha.className = 'linha-digitacao';

    let indice = linha.inicio;
    for (const letra of linha.conteudo) {
      const span = document.createElement('span');
      span.textContent = letra;
      span.className = 'letra';

      if (indice < posicao) span.classList.add('letra--certa');
      else if (indice === posicao) span.classList.add(errouAqui ? 'letra--errada' : 'letra--atual');
      else span.classList.add('letra--falta');

      if (letra === ' ') span.classList.add('letra--espaco');

      elementoLinha.append(span);
      indice += 1;
    }

    novas.append(elementoLinha);
  }

  destino.prepend(novas);
}

     Atualizar NO LUGAR, em vez de remontar

     A tela inteira era desenhada de novo a cada clique num modo. Isso matava
     o cross-fade das ilustrações — o elemento antigo era destruído e o novo
     nascia já opaco — e jogava fora o que estivesse escrito na área de texto
     antes de o input ser salvo. Agora só muda o que muda.
     ------------------------------------------------------------------------ */

  function atualizarModo() {
    for (const botao of tela.querySelectorAll('[data-modo]')) {
      botao.setAttribute('aria-pressed', String(botao.dataset.modo === escolha.modo));
    }

    // A área de texto só some da vista: escondê-la em vez de removê-la é o
    // que preserva o que já foi digitado.
    area.hidden = escolha.modo !== 'proprio';

    escreverRecado();
    mostrarIlustracao(escolha.modo);
  }

  function atualizarDuracao() {
    for (const botao of tela.querySelectorAll('[data-duracao]')) {
      botao.setAttribute('aria-pressed', String(Number(botao.dataset.duracao) === escolha.duracao));
    }
  }

  /** O aviso do modo. Montado em nós, e não em HTML, por já estar na tela. */
  function escreverRecado() {
    recado.replaceChildren();

    /* O aviso do US Internacional pede as DUAS condições: Windows E teclado
       americano. Só o sistema não basta — quem usa ABNT2 no Windows tem
       tecla de acento própria. */
    if (escolha.modo === 'acentos' && sistemaAtual() === 'windows' && layoutAtual() === 'us') {
      const forte = document.createElement('strong');
      forte.textContent = 'US Internacional';

      recado.append(
        'No Windows, para digitar acentos num teclado americano é preciso ativar o layout ',
        forte,
        ' nas configurações de idioma.'
      );
      recado.hidden = false;
      return;
    }

    if (escolha.modo === 'numerico') {
      recado.textContent = 'MacBooks e teclados compactos não têm teclado numérico.';
      recado.hidden = false;
      return;
    }

    recado.hidden = true;
  }

  /** Acende uma ilustração e apaga as outras três. O CSS faz o fade. */
  function mostrarIlustracao(modo) {
    const classe = CLASSE_DA_ILUSTRACAO[modo];

    for (const desenho of ilustracoes.querySelectorAll('.ilustracao')) {
      desenho.classList.toggle('ilustracao--ativa', desenho.classList.contains(classe));
    }
  }

  /* --- Os cliques e o mouse --------------------------------------------- */

  for (const botao of tela.querySelectorAll('[data-modo]')) {
    botao.addEventListener('click', () => {
      escolha = { ...escolha, modo: botao.dataset.modo };
      salvarEscolha(escolha);
      atualizarModo();
    });

    // Prévia: passar o mouse mostra a ilustração daquele modo; ao sair,
    // volta para a do modo escolhido — nunca para o vazio.
    botao.addEventListener('mouseenter', () => mostrarIlustracao(botao.dataset.modo));
    botao.addEventListener('mouseleave', () => mostrarIlustracao(escolha.modo));
  }

  for (const botao of tela.querySelectorAll('[data-duracao]')) {
    botao.addEventListener('click', () => {
      escolha = { ...escolha, duracao: Number(botao.dataset.duracao) };
      salvarEscolha(escolha);
      atualizarDuracao();
    });
  }

  area.addEventListener('input', () => {
    escolha = { ...escolha, textoProprio: area.value };
    salvarEscolha(escolha);
  });

  tela.querySelector('[data-acao="comecar"]').addEventListener('click', () => {
    if (escolha.modo === 'proprio' && !escolha.textoProprio.trim()) {
      area.focus();
      return;
    }
    mostrarSessao();
  });

  atualizarModo();
}

/* Qual ilustração pertence a cada modo.
   A tabela existe porque o desenho do "Texto próprio" veio com a classe
   .ilustracao--texto, e o modo se chama "proprio". Mapear aqui evita mexer
   nos SVGs, que entram no HTML exatamente como foram desenhados. */
const CLASSE_DA_ILUSTRACAO = {
  adaptativo: 'ilustracao--adaptativo',
  acentos: 'ilustracao--acentos',
  numerico: 'ilustracao--numerico',
  proprio: 'ilustracao--texto',
};

function montarTeclasFracas() {
  const { errosPorTecla } = lerEstatisticas();
  const fracas = teclasMaisFracas(8);

  const itens = fracas.map((tecla) => {
    const onde = letraParaTecla(tecla);
    const dedo = onde ? dedoDaTecla(onde.codigo)?.dedo : null;

    return `<span class="tecla-fraca${dedo ? ` tecla-fraca--${dedo}` : ''}">
              ${tecla === ' ' ? 'espaço' : tecla}
              <span class="tecla-fraca-conta">${errosPorTecla[tecla] ?? 0}×</span>
            </span>`;
  }).join('');

  return `<div class="teclas-fracas">${itens}</div>`;
}

/* ==========================================================================
   TELA 2 — a sessão
   ========================================================================== */

let sessao = null;

function encerrarSessao() {
  if (!sessao) return;

  sessao.motor.destruir();
  clearInterval(sessao.relogio);
  document.removeEventListener('keydown', sessao.vigia, true);
  document.removeEventListener('keyup', sessao.vigia, true);
  sessao = null;
}

function mostrarSessao() {
  encerrarSessao();

  /* Teclado e sistema são lidos A CADA USO, e não guardados numa constante:
     trocar de teclado no meio da sessão precisa aparecer na hora, sem sair
     e voltar. Guardá-los aqui deixaria a tela desenhando o teclado antigo. */

  tela.replaceChildren();
  tela.insertAdjacentHTML('beforeend', `
    <div class="licao">
      <div class="sessao-topo">
        <div class="medidas">
          <span class="medida"><strong data-papel="tempo">—</strong> ${escolha.duracao ? 'restam' : 'decorrido'}</span>
          <span class="medida"><strong data-papel="ppm">0</strong> ppm</span>
          <span class="medida"><strong data-papel="precisao">100%</strong> precisão</span>
        </div>

        <button type="button" class="encerrar" data-acao="encerrar">Encerrar</button>
      </div>

      <p class="aviso-caps" data-papel="caps" role="status" hidden>
        O Caps Lock está ligado.
      </p>

      <div class="licao-corpo">
        <div class="licao-texto">
          <div data-papel="texto"></div>
          <p class="licao-espera" data-papel="espera" hidden>Clique no texto para continuar digitando.</p>
        </div>
      </div>

      <p class="apenas-leitor-de-tela" data-papel="legenda" role="status"></p>

      <div class="licao-palco">
        <div data-papel="maos"></div>
        <div data-papel="teclado"></div>
      </div>
    </div>
  `);

  const partes = {
    texto: tela.querySelector('[data-papel="texto"]'),
    legenda: tela.querySelector('[data-papel="legenda"]'),
    maos: tela.querySelector('[data-papel="maos"]'),
    teclado: tela.querySelector('[data-papel="teclado"]'),
    tempo: tela.querySelector('[data-papel="tempo"]'),
    ppm: tela.querySelector('[data-papel="ppm"]'),
    precisao: tela.querySelector('[data-papel="precisao"]'),
    espera: tela.querySelector('[data-papel="espera"]'),
    caps: tela.querySelector('[data-papel="caps"]'),
  };

  desenharMaos(partes.maos);
  desenharTeclado(partes.teclado, layoutAtual(), sistemaAtual());

  const motor = criarMotor({
    modo: escolha.modo,
    textoProprio: escolha.textoProprio,

    aoAtualizar(estado, medidas) {
      desenharTexto(partes.texto, estado);
      apontarProximaTecla(partes, estado);

      partes.ppm.textContent = medidas.ppm;
      partes.precisao.textContent = `${medidas.precisao}%`;
    },

    aoErrar(erro) {
      const errada = letraParaTecla(erro.digitada, layoutAtual());
      const certa = letraParaTecla(erro.esperada, layoutAtual());
      const paraPiscar = errada ?? certa;

      if (paraPiscar) piscarErro(partes.teclado, paraPiscar.codigo);
      tocarErro();
    },

    aoMudarFoco(temFoco) {
      partes.espera.hidden = temFoco;
    },
  });

  motor.montar(partes.texto);

  /* O Caps Lock precisa ser visto ANTES de a letra chegar ao motor, para as
     maiúsculas não contarem como erro. */
  const vigia = (evento) => {
    const ligado = evento.getModifierState?.('CapsLock') ?? false;
    partes.caps.hidden = !ligado;
    if (!ligado) return;

    const escreveLetra = evento.type === 'keydown' && [...evento.key].length === 1;
    if (!escreveLetra) return;

    evento.preventDefault();
    evento.stopPropagation();
    tocarErro();
    motor.focar();
  };

  document.addEventListener('keydown', vigia, true);
  document.addEventListener('keyup', vigia, true);

  /* O relógio. Conta para trás quando há duração, e para frente no Sem fim. */
  const comecouEm = Date.now();

  const relogio = setInterval(() => {
    const decorrido = Math.floor((Date.now() - comecouEm) / 1000);

    if (escolha.duracao) {
      const restam = escolha.duracao - decorrido;
      partes.tempo.textContent = formatarTempo(Math.max(0, restam));
      if (restam <= 0) terminar();
    } else {
      partes.tempo.textContent = formatarTempo(decorrido);
    }
  }, 250);

  partes.tempo.textContent = formatarTempo(escolha.duracao || 0);

  function terminar() {
    const medidas = motor.medidas();
    const tempoTotal = Math.floor((Date.now() - comecouEm) / 1000);

    encerrarSessao();
    mostrarResumo({ ...medidas, tempoTotal });
  }

  /**
   * Redesenha o teclado sem tocar na sessão.
   *
   * Tudo o que importa continua: o texto, a posição no texto, o relógio, os
   * erros e as métricas. O que muda é só o desenho — e a tecla acesa, que
   * precisa ser reapontada porque a mesma letra pode morar noutro lugar no
   * teclado novo. O foco volta para o campo, senão a sessão ficaria parada
   * esperando um clique.
   */
  function redesenhar() {
    desenharTeclado(partes.teclado, layoutAtual(), sistemaAtual());
    apontarProximaTecla(partes, motor.estado());
    motor.focar();
  }

  tela.querySelector('[data-acao="encerrar"]').addEventListener('click', terminar);

  sessao = { motor, relogio, vigia, redesenhar };
}

/** Acende a tecla da vez e a bolinha do dedo. */
function apontarProximaTecla(partes, estado) {
  const letra = estado.letraEsperada;

  if (!letra) {
    limparDestaque(partes.teclado);
    limparDedos(partes.maos);
    partes.legenda.textContent = '';
    return;
  }

  const etapas = passosDaLetra(letra);
  const atual = etapas.length === 2 && !estado.compondo ? etapas[0] : etapas.at(-1);

  if (!atual) {
    limparDestaque(partes.teclado);
    limparDedos(partes.maos);
    partes.legenda.textContent = `Próxima: ${letra}`;
    return;
  }

  destacarTecla(partes.teclado, atual.codigo);

  const posicao = dedoDaTecla(atual.codigo);
  if (posicao) destacarDedo(partes.maos, posicao.mao, posicao.dedo);

  const modificadora = atual.modificador && posicao
    ? teclaDaModificadora(atual.modificador, posicao.mao)
    : null;

  if (modificadora) {
    partes.teclado.querySelector(`[data-codigo="${modificadora.codigo}"]`)
      ?.classList.add('tecla--modificadora');
    pulsarDedo(partes.maos, modificadora.mao, modificadora.dedo);
  }

  // A legenda não aparece na tela: existe só para quem usa leitor de tela,
  // que não enxerga nem a tecla acesa nem a bolinha.
  const nome = atual.letra === ' ' ? 'espaço' : (atual.letra ?? letra).toUpperCase();
  const pedacos = [`Próxima: ${nome}`];

  if (posicao) pedacos.push(nomeDoDedo(posicao.mao, posicao.dedo));
  if (modificadora) pedacos.push(`segure ${modificadora.nome} com o ${nomeDoDedo(modificadora.mao, modificadora.dedo)}`);

  partes.legenda.textContent = pedacos.join(' · ');
}

const NOMES_DE_DEDO = { minimo: 'mínimo', anelar: 'anelar', medio: 'médio', indicador: 'indicador', polegar: 'polegar' };

function nomeDoDedo(mao, dedo) {
  if (mao === 'ambas') return 'qualquer polegar';
  return `${NOMES_DE_DEDO[dedo]} ${mao === 'esquerda' ? 'esquerdo' : 'direito'}`;
}

function formatarTempo(segundos) {
  const minutos = Math.floor(segundos / 60);
  const resto = segundos % 60;
  return `${minutos}:${String(resto).padStart(2, '0')}`;
}

/* ==========================================================================
   TELA 3 — o resumo

   Sem estrelas, sem aprovado nem reprovado, sem liberar nada. Treino livre
   não tem nota: o resumo é só o retrato do que acabou de acontecer.
   ========================================================================== */

function mostrarResumo(resultado) {
  const modo = MODOS.find((m) => m.id === escolha.modo);

  const piores = Object.entries(resultado.errosPorTecla)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  tela.replaceChildren();
  tela.insertAdjacentHTML('beforeend', `
    <div class="resumo">
      <h1>Fim do treino.</h1>
      <p class="subtitulo">${modo.nome} · ${escolha.duracao ? formatarTempo(escolha.duracao) : 'sem fim'}</p>

      <div class="resumo-numeros">
        <div>
          <p class="resumo-numero">${resultado.ppm}</p>
          <p class="ajuda">palavras por minuto</p>
        </div>
        <div>
          <p class="resumo-numero">${resultado.precisao}%</p>
          <p class="ajuda">precisão</p>
        </div>
        <div>
          <p class="resumo-numero">${formatarTempo(resultado.tempoTotal)}</p>
          <p class="ajuda">de treino</p>
        </div>
      </div>

      <p class="grupo-rotulo">Teclas que mais escaparam</p>
      ${
        piores.length
          ? `<div class="teclas-fracas">${piores.map(([tecla, quantas]) => {
              const onde = letraParaTecla(tecla);
              const dedo = onde ? dedoDaTecla(onde.codigo)?.dedo : null;

              return `<span class="tecla-fraca${dedo ? ` tecla-fraca--${dedo}` : ''}">
                        ${tecla === ' ' ? 'espaço' : tecla}
                        <span class="tecla-fraca-conta">${quantas}×</span>
                      </span>`;
            }).join('')}</div>`
          : '<p class="ajuda">Nenhuma: você não errou nenhuma tecla.</p>'
      }

      <div class="resumo-acoes">
        <button type="button" class="botao botao--principal" data-acao="de-novo">Treinar de novo</button>
        <button type="button" class="botao" data-acao="voltar">Voltar ao treino livre</button>
      </div>
    </div>
  `);

  tela.querySelector('[data-acao="de-novo"]').addEventListener('click', mostrarSessao);
  tela.querySelector('[data-acao="voltar"]').addEventListener('click', mostrarSelecao);
}

/* ==========================================================================
   A barra do rascunho
   ========================================================================== */

const botaoTema = document.querySelector('#alternar-tema');

botaoTema.addEventListener('click', () => {
  const escuro = document.documentElement.dataset.tema === 'escuro';
  document.documentElement.dataset.tema = escuro ? 'claro' : 'escuro';
  botaoTema.textContent = escuro ? 'Modo escuro' : 'Modo claro';
});

const botaoSistema = document.querySelector('#alternar-sistema');

function escreverBotaoDoSistema() {
  botaoSistema.textContent = `Sistema: ${sistemaAtual() === 'mac' ? 'Mac' : 'Windows'}`;
}

botaoSistema.addEventListener('click', () => {
  definirSistema(sistemaAtual() === 'mac' ? 'windows' : 'mac');
  escreverBotaoDoSistema();

  if (sessao) sessao.redesenhar();
  else mostrarSelecao();
});

const botaoTeclado = document.querySelector('#alternar-teclado');

function escreverBotaoDoTeclado() {
  botaoTeclado.textContent = `Teclado: ${layoutAtual() === 'abnt2' ? 'ABNT2' : 'US'}`;
}

botaoTeclado.addEventListener('click', () => {
  definirLayout(layoutAtual() === 'abnt2' ? 'us' : 'abnt2');
  escreverBotaoDoTeclado();

  // No meio da sessão o teclado troca na hora, sem recomeçar nada.
  if (sessao) sessao.redesenhar();
  else mostrarSelecao();
});

const botaoSom = document.querySelector('#botao-som');

botaoSom.addEventListener('click', () => {
  mudo = !mudo;
  botaoSom.setAttribute('aria-pressed', String(mudo));
  botaoSom.setAttribute('aria-label', mudo ? 'Ligar os sons' : 'Silenciar os sons');
  botaoSom.querySelector('use').setAttribute('href', mudo ? '#icone-mudo' : '#icone-som');
});

escreverBotaoDoTeclado();
escreverBotaoDoSistema();
mostrarSelecao();
</script>

</body>
</html>
