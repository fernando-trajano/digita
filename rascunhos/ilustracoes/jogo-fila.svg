<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg"
     class="ilustracao ilustracao--fila" aria-hidden="true"
     style="font-family: var(--fonte-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- A pilha: teclas em ziguezague descendo. A de baixo é a próxima a
       digitar, e está quase encostando na linha. As de cima acabaram de
       nascer, por isso vão ficando mais claras. -->
  <g fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="144" y="152" width="44" height="44" rx="8" opacity="0.9"/>
    <rect x="96"  y="106" width="44" height="44" rx="8" opacity="0.66"/>
    <rect x="180" y="60"  width="44" height="44" rx="8" opacity="0.44"/>
    <rect x="128" y="14"  width="44" height="44" rx="8" opacity="0.26"/>
  </g>

  <g fill="currentColor" stroke="none" text-anchor="middle" dominant-baseline="central"
     font-size="20">
    <text x="166" y="175" opacity="0.9">f</text>
    <text x="118"  y="129" opacity="0.66">j</text>
    <text x="202" y="83"  opacity="0.44">d</text>
    <text x="150" y="37"  opacity="0.26">k</text>
  </g>

  <!-- A linha de acerto: onde a tecla encaixa e desaparece. -->
  <path d="M34 208 L286 208" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
</svg>
