<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg"
     class="ilustracao ilustracao--cobra" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

    <!-- Rastro: o que a cobra já passou, sumindo para trás. -->
    <path d="M14 178 C24 166, 34 172, 42 166" stroke-width="1.4" opacity="0.18"/>
    <path d="M22 196 C32 186, 40 190, 48 184" stroke-width="1.2" opacity="0.12"/>

    <!-- A cobra: um traço só, serpenteando da esquerda para a direita.
         A cabeça aponta para o ponto do jogador. -->
    <path d="M28 168 C68 116, 96 206, 136 154 C176 102, 204 192, 244 142"
          stroke-width="2.6" opacity="0.85"/>
  </g>

  <!-- O jogador: um ponto à frente, sempre escapando. -->
  <circle cx="288" cy="112" r="6.5" fill="currentColor" opacity="0.95"/>

  <!-- A distância entre os dois: o fôlego que o jogo mede. -->
  <path d="M256 132 L274 120" fill="none" stroke="currentColor"
        stroke-width="1.2" stroke-linecap="round" opacity="0.28"/>
</svg>
