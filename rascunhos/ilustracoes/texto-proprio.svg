<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg"
     class="ilustracao ilustracao--texto" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <g fill="none" stroke="currentColor" stroke-linecap="round">

    <!-- O bloco de texto: linhas de comprimentos irregulares, alinhadas à
         esquerda, com a borda direita rasgada. -->
    <path d="M46 58 L252 58"  stroke-width="2.4" opacity="0.72"/>
    <path d="M46 80 L274 80"  stroke-width="2.4" opacity="0.68"/>
    <path d="M46 102 L214 102" stroke-width="2.4" opacity="0.64"/>

    <!-- Duas linhas deslocadas e mais claras: o texto sendo colado ali. -->
    <path d="M64 124 L246 124" stroke-width="2.2" opacity="0.38"/>

    <path d="M46 146 L266 146" stroke-width="2.4" opacity="0.6"/>
    <path d="M46 168 L196 168" stroke-width="2.4" opacity="0.56"/>

    <path d="M76 190 L258 190" stroke-width="2.2" opacity="0.3"/>

    <!-- A última linha, curta, e o cursor no fim dela. -->
    <path d="M46 212 L118 212" stroke-width="2.4" opacity="0.52"/>
    <path d="M132 199 L132 225" stroke-width="2.8" opacity="0.9"/>
  </g>
</svg>
