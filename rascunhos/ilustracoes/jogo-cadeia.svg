<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg"
     class="ilustracao ilustracao--cadeia" aria-hidden="true"
     style="font-family: var(--fonte-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Três rodadas, uma por linha: a sequência cresce de baixo para cima
       a cada acerto. Dentro de cada linha, as letras somem da esquerda
       para a direita — é o que você digita de memória. -->
  <g fill="currentColor" stroke="none" text-anchor="middle" dominant-baseline="central"
     font-size="26">

    <text x="44"  y="62" opacity="0.85">f</text>
    <text x="80"  y="62" opacity="0.50">j</text>
    <text x="116" y="62" opacity="0.18">d</text>

    <text x="44"  y="126" opacity="0.85">k</text>
    <text x="80"  y="126" opacity="0.68">a</text>
    <text x="116" y="126" opacity="0.50">s</text>
    <text x="152" y="126" opacity="0.30">d</text>
    <text x="188" y="126" opacity="0.12">f</text>

    <text x="44"  y="190" opacity="0.85">j</text>
    <text x="80"  y="190" opacity="0.74">f</text>
    <text x="116" y="190" opacity="0.60">k</text>
    <text x="152" y="190" opacity="0.46">l</text>
    <text x="188" y="190" opacity="0.32">a</text>
    <text x="224" y="190" opacity="0.20">s</text>
    <text x="260" y="190" opacity="0.10">d</text>
  </g>
</svg>
