<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg"
     class="ilustracao ilustracao--adaptativo" aria-hidden="true"
     style="font-family: var(--fonte-mono, ui-monospace, SFMono-Regular, Menlo, monospace)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Linhas de "mira": ligam apenas os caracteres grandes, os que o modo
       sorteia mais. Param antes de tocar no glifo, para não cortar a letra. -->
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.22">
    <path d="M131 117 L178 101"/>
    <path d="M219 114 L234 139"/>
    <path d="M122 152 L135 166"/>
    <path d="M171 177 L224 163"/>
  </g>

  <!-- Caracteres soltos, sem alinhamento. O tamanho e o tom marcam a
       dificuldade: grande e forte = tecla que escapa; pequeno e claro =
       tecla já dominada. -->
  <g fill="currentColor" stroke="none" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="128" font-size="48" opacity="0.95">ç</text>
    <text x="205" y="92"  font-size="40" opacity="0.85">q</text>
    <text x="150" y="182" font-size="30" opacity="0.70">z</text>
    <text x="245" y="158" font-size="27" opacity="0.60">p</text>

    <text x="58"  y="72"  font-size="17" opacity="0.34">w</text>
    <text x="118" y="58"  font-size="14" opacity="0.30">x</text>
    <text x="272" y="55"  font-size="15" opacity="0.30">k</text>
    <text x="62"  y="192" font-size="16" opacity="0.30">b</text>
    <text x="180" y="214" font-size="14" opacity="0.27">a</text>
    <text x="288" y="206" font-size="13" opacity="0.24">m</text>
    <text x="30"  y="140" font-size="12" opacity="0.22">s</text>
    <text x="300" y="120" font-size="12" opacity="0.20">f</text>
  </g>
</svg>
